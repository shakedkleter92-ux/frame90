                // single-webcam device before deciding which default to use.
                if (isMobileLayout() && !liveState.userSetFacing && !liveState.didSetMobileFacingDefault) {
                    const multi = await hasMultipleCameras();
                    liveState.facingMode = (multi === false) ? 'user' : 'environment';
                    liveState.mirror = (liveState.facingMode === 'user');
                    liveState.didSetMobileFacingDefault = true;
                }
                if (isMobileLayout() && !liveState.didSetMobileZoomDefault) {
                    // Set UI immediately; hardware zoom will be applied after stream starts.
                    setZoomUIValue(0.5);
                    liveState.didSetMobileZoomDefault = true;
                }
                // Sync Live ratio to breakpoint (single source of truth)
                liveState.aspectRatio = getLiveTargetRatioKey();
                liveCoverCanvas = null;
                liveCoverLastRatio = null;
                ensureLiveOptionsUI();
                wireMobileZoomUI();

                try {
                    // Ask for mic audio too (used by video recording); camera still works without it.
                    liveState.stream = await navigator.mediaDevices.getUserMedia({
                        video: getLiveVideoConstraints(), audio: true
                    });
                } catch (_) {
                    liveState.stream = await navigator.mediaDevices.getUserMedia({
                        video: getLiveVideoConstraints(), audio: false
                    });
                }
                liveVideo.srcObject = liveState.stream;
                await liveVideo.play();
                try {
                    const vt = liveState.stream && liveState.stream.getVideoTracks ? liveState.stream.getVideoTracks()[0] : null;
                    if (vt) {
                        const s = (typeof vt.getSettings === 'function') ? vt.getSettings() : null;
                        const c = (typeof vt.getConstraints === 'function') ? vt.getConstraints() : null;
                        const cap = (typeof vt.getCapabilities === 'function') ? vt.getCapabilities() : null;
                        __liveZoomCaps = (cap && cap.zoom) ? cap.zoom : null;
                        computeLiveZoomRange();
                        renderZoomTicks();
                        renderZoomPresets();
                        try {
                            // First launch opens at 0.5× (or the widest the hardware allows) —
                            // the grid app's default, and its fix for "everything looks too
                            // close" on a full-screen 9:16 frame. After that (camera flip,
                            // ultra-wide swap) keep the user's zoom, re-applied to the new
                            // stream so the hardware/software split is never stale.
                            if (isMobileLayout() && !liveState.didApplyMobileHardwareZoomDefault && __liveZoomCaps && typeof __liveZoomCaps.min === 'number') {
                                const pref = 0.5;
                                const zmin = __liveZoomCaps.min;
                                const zmax = (typeof __liveZoomCaps.max === 'number') ? __liveZoomCaps.max : zmin;
                                const target = (pref >= zmin && pref <= zmax) ? pref : zmin;
                                setZoomUIValue(target);
                                applyHardwareZoomIfPossible(target);
                                liveState.didApplyMobileHardwareZoomDefault = true;
                            } else if (liveState.usingUltraWide) {
                                markUltraWideActive();
                                applyHardwareZoomIfPossible(1);
                            } else {
                                setZoomUIValue(liveState.userZoom || 1);
                                applyHardwareZoomIfPossible(liveState.userZoom || 1);
                            }
                        } catch (_) { }
                        __liveTrackDebug = { settings: s, constraints: c, capabilities: cap };
                    } else {
                        __liveTrackDebug = null;
                    }
                } catch (_) { __liveTrackDebug = null; }
                liveState.rafId = requestAnimationFrame(liveLoop);
            } catch (err) {
                alert('Camera error: ' + err.message);
                switchToMode('image');
            }
        }

        function stopCamera() {
            if (liveState.rafId) { cancelAnimationFrame(liveState.rafId); liveState.rafId = null; }
            if (liveState.stream) { liveState.stream.getTracks().forEach(t => t.stop()); liveState.stream = null; }
            liveVideo.srcObject = null;
        }

        function switchToMode(mode) {
            const prevMode = state.mode;
            const isSwitch = prevMode !== mode;
            if (state.mode === 'live') {
                stopCamera();
                liveCoverCanvas = null;
            }
            // Leaving Upload: clear the loaded photo so Upload starts fresh next time
            if (isSwitch && prevMode === 'image') {
                state.srcImage = null;
                state.uploadRect = null;
                const fn = document.getElementById('file-name');
                if (fn) fn.textContent = '';
                const fi = document.getElementById('file-input');
                if (fi) fi.value = '';
            }
            state.mode = mode;
            document.body.classList.toggle('mode-upload', mode === 'image');
            document.querySelectorAll('.fm-btn[id^="fm-"]').forEach(b => b.classList.remove('active'));
            // Upload zone overlays the canvas, shown only in Upload mode with no photo loaded yet
            updateUploadZoneVisibility();
            if (mode === 'image') {
                var fmImg = document.getElementById('fm-image'); if (fmImg) fmImg.classList.add('active');
                renderUpload();
            } else if (mode === 'live') {
                var fmLive = document.getElementById('fm-live'); if (fmLive) fmLive.classList.add('active');
                window.__liveLayoutMode = getLayoutMode();
                renderView();
                startCamera();
            }
            if (typeof updateMobileButtonsForMode === 'function') updateMobileButtonsForMode();
            if (typeof updateModeRowActive === 'function') updateModeRowActive();
        }


        // ═══════════════════════════════════════════════════
        //  MOBILE: Panel toggle
        // ═══════════════════════════════════════════════════
        const panelToggleBar = document.getElementById('panel-toggle-bar');
        const panel = document.getElementById('panel');
        const mobShutter = document.getElementById('mob-shutter');
        const mobUploadMore = document.getElementById('mob-upload-more');
        const mobFlip = document.getElementById('mob-flip');
        const mobDl = document.getElementById('mob-download');
        const mobRatio = document.getElementById('mob-ratio');
        const mobGallery = document.getElementById('mob-gallery');
        const mobZoomPop = document.getElementById('mob-zoom-pop');

        // Mobile FAB visibility by mode:
        // - Live: show shutter + flip + ratio + download
        // - Upload: show download only
        function updateMobileButtonsForMode() {
            const isSmall = isMobileLayout();
            var modeBtn = document.getElementById('mob-capture-mode');
            var zoomPresets = document.getElementById('mob-zoom-presets');
            var sideSliderWrap = document.getElementById('mob-side-slider-wrap');
            var filmBadge = document.getElementById('mob-film-badge');
            if (!isSmall) {
                mobShutter.style.display = 'none';
                if (mobUploadMore) mobUploadMore.style.display = 'none';
                mobFlip.style.display = 'none';
                mobDl.style.display = 'none';
                if (mobZoomPop) mobZoomPop.style.display = 'none';
                if (mobRatio) mobRatio.style.display = 'none';
                if (modeBtn) modeBtn.style.display = 'none';
                if (mobGallery) mobGallery.style.display = 'none';
                if (zoomPresets) zoomPresets.style.display = 'none';
                if (sideSliderWrap) sideSliderWrap.style.display = 'none';
                if (filmBadge) filmBadge.style.display = 'none';
                return;
            }

            // The side slider and film badge are worth having in both modes, so they're
            // always shown, same as the gallery FAB.
            if (sideSliderWrap) sideSliderWrap.style.display = 'flex';
            if (filmBadge) filmBadge.style.display = 'flex';

            // The panel now opens downward from the top bar, so it no longer overlaps the
            // bottom controls — no need to hide them while it's open (unlike before, when
            // the panel was a bottom sheet that would sit on top of them).

            // Mobile download FAB:
            // - In Live we download via the preview modal, so hide this button.
            // - In Upload keep it available — it now sends the result to the gallery
            //   (saveUploadResultToGallery), same row/size as flip, right side.
            mobDl.style.display = (state.mode === 'live') ? 'none' : 'flex';
            if (mobZoomPop && state.mode !== 'live') mobZoomPop.style.display = 'none';

            // The Video/Photo/Upload row is the app's one mode switcher now — always visible
            // on mobile (panel closed), regardless of which mode is currently active.
            if (modeBtn) modeBtn.style.display = 'flex';
            // Gallery is available from both modes now (Upload sends its result there too).
            if (mobGallery) mobGallery.style.display = 'flex';

            if (state.mode === 'live') {
                mobShutter.style.display = 'block';
                if (mobUploadMore) mobUploadMore.style.display = 'none';
                mobFlip.style.display = 'flex';
                // Ratio button disabled on mobile: Live fits device automatically
                if (mobRatio) mobRatio.style.display = 'none';
                if (zoomPresets) zoomPresets.style.display = 'flex';
            } else {
                mobShutter.style.display = 'none';
                // Upload's shutter-equivalent: always available, even with an image already
                // loaded, so there's a way to replace it (the drop-zone itself only shows
                // before the first image is picked).
                if (mobUploadMore) mobUploadMore.style.display = 'flex';
                mobFlip.style.display = 'none';
                if (mobRatio) mobRatio.style.display = 'none';
                if (zoomPresets) zoomPresets.style.display = 'none';
            }
        }

        function toggleMobilePanel() {
            panel.classList.toggle('panel-open');
            var isOpen = panel.classList.contains('panel-open');
            panelToggleBar.classList.toggle('active', isOpen);
            document.body.classList.toggle('panel-open', isOpen);
            updateMobileButtonsForMode();
            // Update CSS var with actual panel height to avoid whitespace gaps
            requestAnimationFrame(() => {
                const h = isOpen ? Math.round(panel.getBoundingClientRect().height) : 0;
                document.documentElement.style.setProperty('--panel-open-h', h + 'px');
                refreshView();
                // The film list has no real layout (0 height) while the panel's collapsed
                // (max-height:0) — only safe to measure it for the scroll-thumb sync once open.
                if (isOpen && typeof scrollActiveIntoView === 'function') scrollActiveIntoView();
            });
            // Panel opens with a transition; resync after it settles so canvas always moves up.
            if (isOpen) {
                setTimeout(() => {
                    syncPanelOpenHeightVar();
                    refreshView();
                }, 380);
            }
        }

        function syncPanelOpenHeightVar() {
            try {
                if (!panel) return;
                const isOpen = panel.classList.contains('panel-open') || document.body.classList.contains('panel-open');
                const h = isOpen ? Math.round(panel.getBoundingClientRect().height) : 0;
                document.documentElement.style.setProperty('--panel-open-h', h + 'px');
            } catch (_) { }
        }

        if (panelToggleBar) panelToggleBar.addEventListener('click', () => {
            toggleMobilePanel();
        });
        // Tapping anywhere outside the open panel closes it — the hamburger itself is
        // hidden while open (see body.panel-open CSS), so this is the way back out besides
        // picking something inside it.
        document.addEventListener('click', (e) => {
            if (!panel.classList.contains('panel-open')) return;
            if (panel.contains(e.target) || (panelToggleBar && panelToggleBar.contains(e.target))) return;
            const badge = document.getElementById('mob-film-badge');
            if (badge && badge.contains(e.target)) return;
            toggleMobilePanel();
        });
        // Ensure initial layout uses correct panel height (if panel starts open)
        syncPanelOpenHeightVar();
        try { window.__layoutMode = getLayoutMode(); } catch (_) { }

        // ═══════════════════════════════════════════════════
        //  MOBILE: Camera buttons
        // ═══════════════════════════════════════════════════

        // Camera flip
        function flipCamera() {
            if (state.mode !== 'live') return;
            liveState.userSetFacing = true;
            liveState.facingMode = liveState.facingMode === 'user' ? 'environment' : 'user';
            liveState.mirror = (liveState.facingMode === 'user');
            // No ultra-wide selfie lens — flipping to the front camera always means the
            // normal one.
            liveState.usingUltraWide = false;
            stopCamera();
            startCamera();
        }
        if (mobFlip) mobFlip.addEventListener('click', flipCamera);
        var flipCamBtn = document.getElementById('l-flip-cam');
        if (flipCamBtn) flipCamBtn.addEventListener('click', flipCamera);

        function cycleAspectRatio() {
            const orderMobile = ['9:16', '4:5', '3:4', '1:1'];
            const orderDesktop = ['16:9', '4:5', '3:4', '1:1'];
            const order = isMobileLayout() ? orderMobile : orderDesktop;

            const idx = order.indexOf(liveState.aspectRatio);
            liveState.aspectRatio = order[(idx >= 0 ? idx + 1 : 0) % order.length];
            // Never allow landscape option on mobile
            if (isMobileLayout() && liveState.aspectRatio === '16:9') liveState.aspectRatio = '9:16';
            liveCoverCanvas = null;
            liveCoverLastRatio = null;
            if (mobRatio) {
                mobRatio.setAttribute('aria-label', 'Aspect ratio ' + liveState.aspectRatio);
                mobRatio.title = liveState.aspectRatio;
            }
            // Force immediate refresh (helps when CSS/layout caches)
            if (state.mode === 'live') refreshView();
        }
        if (mobRatio) mobRatio.addEventListener('click', cycleAspectRatio);

        var mobCaptureModeBtn = document.getElementById('mob-capture-mode');
        function updateModeRowActive() {
            if (!mobCaptureModeBtn) return;
            // Inactive labels are white-on-shadow so they read over a busy camera feed;
            // Upload's backdrop is the plain white canvas, so flip them dark there instead.
            mobCaptureModeBtn.classList.toggle('on-light-bg', state.mode !== 'live');
            mobCaptureModeBtn.querySelectorAll('.mob-mode-label').forEach((b) => {
                const isActive = b.dataset.appMode
                    ? state.mode === b.dataset.appMode
                    : (state.mode === 'live' && state.captureMode === b.dataset.capMode);
                b.classList.toggle('active', isActive);
            });
        }
        function setCaptureMode(mode) {
            state.captureMode = (mode === 'video') ? 'video' : 'image';
            if (mobShutter) mobShutter.classList.toggle('mode-video', state.captureMode === 'video');
            updateModeRowActive();
            // Defensive: Photo and Video share one zoom-presets row (there's only one
            // camera stream underneath both), but re-render on every switch so it can
            // never be caught showing a stale set from before capabilities were ready.
            if (typeof renderZoomPresets === 'function') renderZoomPresets();
        }
        if (mobCaptureModeBtn) mobCaptureModeBtn.addEventListener('click', function (e) {
            const btn = e.target.closest('.mob-mode-label');
            if (!btn) return;
            if (btn.dataset.appMode) { switchToMode(btn.dataset.appMode); return; }
            if (state.mode !== 'live') switchToMode('live');
            setCaptureMode(btn.dataset.capMode);
        });

        var mobZoomPresets = document.getElementById('mob-zoom-presets');
        if (mobZoomPresets) mobZoomPresets.addEventListener('click', function (e) {
            const btn = e.target.closest('.mob-zoom-preset');
            if (!btn) return;
            const v = parseFloat(btn.dataset.z) || 1;
            if (btn.dataset.ultraWide) {
                setUltraWideZoom();
                return;
            }
            leaveUltraWideIfNeeded().then(() => {
                setZoomUIValue(v);
                applyHardwareZoomIfPossible(v);
            });
        });

        // Swipe left/right on the viewfinder to switch Photo <-> Video, like a phone camera's mode row.
        (function () {
            let sx = 0, sy = 0, tracking = false;
            const SWIPE_MIN = 40;
            gridCanvas.addEventListener('touchstart', (e) => {
                if (state.mode !== 'live' || !e.touches || e.touches.length !== 1) { tracking = false; return; }
                tracking = true;
                sx = e.touches[0].clientX; sy = e.touches[0].clientY;
            }, { passive: true });
            gridCanvas.addEventListener('touchend', (e) => {
                if (!tracking) return;
                tracking = false;
                if (state.mode !== 'live') return;
                const t = e.changedTouches && e.changedTouches[0];
                if (!t) return;
                const dx = t.clientX - sx, dy = t.clientY - sy;
                if (Math.abs(dx) > SWIPE_MIN && Math.abs(dx) > Math.abs(dy) * 1.5) {
                    setCaptureMode(state.captureMode === 'image' ? 'video' : 'image');
                }
            }, { passive: true });
        })();

        var liveVideoRecorder = null;
        var recordedChunks = [];
        var liveRecordCanvas = null;
        var liveRecordCtx = null;
        var liveRecordInterval = null;
        var LIVE_RECORD_FPS = 30;

        function stopRecordInterval() {
            if (liveRecordInterval) {
                clearInterval(liveRecordInterval);
                liveRecordInterval = null;
            }
        }

        var recTimerInterval = null, recStartTime = 0;
        function startRecTimer() {
            const el = document.getElementById('mob-rec-timer');
            recStartTime = Date.now();
            if (el) { el.textContent = '00:00'; el.style.display = 'flex'; }
            clearInterval(recTimerInterval);
            recTimerInterval = setInterval(function () {
                const secs = Math.floor((Date.now() - recStartTime) / 1000);
                const mm = String(Math.floor(secs / 60)).padStart(2, '0');
                const ss = String(secs % 60).padStart(2, '0');
                if (el) el.textContent = mm + ':' + ss;
            }, 500);
        }
        function stopRecTimer() {
            clearInterval(recTimerInterval);
            recTimerInterval = null;
            const el = document.getElementById('mob-rec-timer');
            if (el) el.style.display = 'none';
        }

        // Each recorded frame is a blit of the preview film frame liveLoop() already
        // rendered this animation frame — never a second shader pass here. Rendering twice
        // per tick (once for the screen, once again for the recorder) starves the main
        // thread, which shows up as choppy video *and* stuttering audio (MediaRecorder's
        // timing gets starved when JS is this busy). Frame/date overlays are drawn on top.
        function drawRecordFrame() {
            if (!liveRecordCtx || !liveRecordCanvas) return;
            const W = liveRecordCanvas.width, H = liveRecordCanvas.height;
            if (liveCoverCanvas && liveCoverCanvas.width > 2) {
                liveRecordCtx.drawImage(liveCoverCanvas, 0, 0, W, H);
            } else {
                liveRecordCtx.fillStyle = '#000';
                liveRecordCtx.fillRect(0, 0, W, H);
            }
            drawFilmOverlays(liveRecordCtx, 0, 0, W, H, activeFilmSettings());
        }

        var pendingRecordPoster = null;
        function toggleVideoRecording() {
            if (!liveState.stream) return;
            if (liveVideoRecorder && liveVideoRecorder.state === 'recording') {
                stopRecordInterval();
                // The last recorded frame becomes the video's still thumbnail (gallery FAB +
                // grid) — a <video> element as a thumbnail shows black on iOS until played.
                pendingRecordPoster = makeThumbDataURL(liveRecordCanvas);
                liveVideoRecorder.stop();
                mobShutter.classList.remove('recording');
                document.body.classList.remove('recording');
                stopRecTimer();
                liveRecordCanvas = null;
                liveRecordCtx = null;
                return;
            }
            recordedChunks = [];
            var recordRatio = getLiveTargetRatioKey();
            var dim = getLiveCoverDimensions(recordRatio);
            liveRecordCanvas = document.createElement('canvas');
            liveRecordCanvas.width = dim.w;
            liveRecordCanvas.height = dim.h;
            liveRecordCtx = liveRecordCanvas.getContext('2d');
            // Seed real content before the stream/recorder start, so the first
            // captured frame isn't a blank black canvas.
            drawRecordFrame();
            var mime = 'video/webm';
            if (MediaRecorder.isTypeSupported('video/mp4')) mime = 'video/mp4';
            else if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9')) mime = 'video/webm;codecs=vp9';
            var canvasStream = liveRecordCanvas.captureStream(LIVE_RECORD_FPS);
            var audioTracks = (liveState.stream && liveState.stream.getAudioTracks) ? liveState.stream.getAudioTracks() : [];
            var stream = audioTracks.length
                ? new MediaStream([].concat(canvasStream.getVideoTracks(), audioTracks))
                : canvasStream;
            try {
                liveVideoRecorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 5000000 });
            } catch (e) {
                liveVideoRecorder = new MediaRecorder(stream);
            }
            liveVideoRecorder.ondataavailable = function (e) { if (e.data.size) recordedChunks.push(e.data); };
            liveVideoRecorder.onstop = function () {
                stopRecordInterval();
                mobShutter.classList.remove('recording');
                document.body.classList.remove('recording');
                stopRecTimer();
                liveRecordCanvas = null;
                liveRecordCtx = null;
                if (recordedChunks.length === 0) return;
                var rec = liveVideoRecorder;
                var mimeType = rec.mimeType || 'video/webm';
                var ext = mimeType.indexOf('mp4') !== -1 ? 'mp4' : 'webm';
                var blob = new Blob(recordedChunks, { type: mimeType });
                var fileName = filmFileName('video', ext);
                addToGallery({ type: 'video', blob, mimeType, fileName, poster: pendingRecordPoster });
                pendingRecordPoster = null;
                liveVideoRecorder = null;
            };
            liveVideoRecorder.start(1000 / LIVE_RECORD_FPS);
            liveRecordInterval = setInterval(function () {
                if (!(liveRecordCanvas && liveRecordCtx && liveVideoRecorder && liveVideoRecorder.state === 'recording')) return;
                drawRecordFrame();
            }, 1000 / LIVE_RECORD_FPS);
            mobShutter.classList.add('recording');
            document.body.classList.add('recording');
            startRecTimer();
        }

        // ═══════════════════════════════════════════════════
        //  GALLERY — in-memory only, cleared on reload like everything else in this app
        // ═══════════════════════════════════════════════════
        var galleryItems = []; // newest first: { id, type, url, mimeType, fileName, selected }
        var galleryIdSeq = 0;

        function addToGallery(item) {
            if (item.type === 'image') {
                item.canvas.toBlob(function (blob) {
                    if (!blob) return;
                    addGalleryEntry({ type: 'image', blob: blob, mimeType: 'image/jpeg', fileName: item.fileName });
                }, 'image/jpeg', 0.92);
            } else {
                addGalleryEntry({ type: 'video', blob: item.blob, mimeType: item.mimeType, fileName: item.fileName, poster: item.poster || null });
            }
        }

        function addGalleryEntry(entry) {
            entry.id = 'g' + (++galleryIdSeq);
            entry.url = URL.createObjectURL(entry.blob);
            entry.selected = false;
            galleryItems.unshift(entry);
            updateGalleryFabThumb();
            if (mobGallery) {
                mobGallery.classList.remove('pop');
                void mobGallery.offsetWidth; // restart the animation
                mobGallery.classList.add('pop');
            }
            if (document.getElementById('gallery-screen').style.display !== 'none') renderGallery();
        }

        function updateGalleryFabThumb() {
            if (!mobGallery) return;
            const latest = galleryItems[0];
            if (!latest) {
                mobGallery.classList.remove('has-thumb');
                mobGallery.innerHTML = '<span class="gallery-empty-frame"></span>';
                return;
            }
            mobGallery.classList.add('has-thumb');
            mobGallery.innerHTML = '';
            const img = document.createElement('img');
            img.alt = '';
            img.src = latest.type === 'video' ? (latest.poster || '') : latest.url;
            mobGallery.appendChild(img);
            if (latest.type === 'video') {
                const badge = document.createElement('span');
                badge.className = 'gallery-fab-video';
                badge.textContent = '▶';
                mobGallery.appendChild(badge);
            }
        }

        // Small JPEG still of a canvas, for video thumbnails.
        function makeThumbDataURL(canvas) {
            try {
                if (!canvas || !canvas.width) return null;
                const t = document.createElement('canvas');
                const sc = 240 / Math.max(canvas.width, canvas.height);
                t.width = Math.max(1, Math.round(canvas.width * sc));
                t.height = Math.max(1, Math.round(canvas.height * sc));
                t.getContext('2d').drawImage(canvas, 0, 0, t.width, t.height);
                return t.toDataURL('image/jpeg', 0.8);
            } catch (_) { return null; }
        }

        // Off by default — the grid opens straight into "tap to view", the same as any
        // phone photo gallery. Turning this on (via the header's Select button) is what
        // reveals the check circles and makes the whole tile the tap target for toggling
        // selection, instead of the previous always-on tiny corner circle that was easy to
        // miss and just opened the viewer instead.
        let gallerySelectMode = false;

        function renderGallery() {
            const grid = document.getElementById('gallery-grid');
            const empty = document.getElementById('gallery-empty');
            const countEl = document.getElementById('gallery-count');
            const delBtn = document.getElementById('gallery-delete');
            const dlBtn = document.getElementById('gallery-download');
            const screen = document.getElementById('gallery-screen');
            const selectToggle = document.getElementById('gallery-select-toggle');
            if (screen) screen.classList.toggle('select-mode', gallerySelectMode);
            if (selectToggle) {
                selectToggle.textContent = gallerySelectMode ? 'Cancel' : 'Select';
                selectToggle.classList.toggle('active', gallerySelectMode);
            }
            if (!grid) return;
            grid.innerHTML = '';
            if (galleryItems.length === 0) {
                grid.style.display = 'none';
                if (empty) empty.style.display = 'flex';
            } else {
                grid.style.display = 'grid';
                if (empty) empty.style.display = 'none';
                galleryItems.forEach((item) => {
                    const cell = document.createElement('div');
                    cell.className = 'gallery-item' + (item.selected ? ' selected' : '');
                    cell.dataset.id = item.id;
                    if (item.type === 'video') {
                        if (item.poster) {
                            const pimg = document.createElement('img');
                            pimg.src = item.poster; pimg.alt = '';
                            cell.appendChild(pimg);
                        } else {
                            const v = document.createElement('video');
                            v.src = item.url; v.muted = true; v.playsInline = true;
                            cell.appendChild(v);
                        }
                        const badge = document.createElement('span');
                        badge.className = 'gallery-video-badge'; badge.textContent = '▶';
                        cell.appendChild(badge);
                    } else {
                        const img = document.createElement('img');
                        img.src = item.url; img.alt = '';
                        cell.appendChild(img);
                    }
                    const check = document.createElement('span');
                    check.className = 'gallery-check';
                    cell.appendChild(check);
                    grid.appendChild(cell);
                });
            }

            const screen = document.getElementById('gallery-screen');

            // persisting state across a fresh look at something.

            // anywhere opens the full-screen viewer, like any phone photo gallery.

            // this used to always do the plain <a download> click, which on iOS Safari just
            // navigates to the item full-screen instead of downloading it (download isn't
            // honored there). shareOrDownloadBlob() tries the native share sheet first, where
            // Save Image/Save Video is one tap, no extra page.
            shareOrDownloadBlob(item.blob, item.fileName, item.mimeType);
        }

        const galleryDeleteBtn = document.getElementById('gallery-delete');
        if (galleryDeleteBtn) galleryDeleteBtn.addEventListener('click', () => {
            const keep = [];
            galleryItems.forEach((item) => {
                if (item.selected) { try { URL.revokeObjectURL(item.url); } catch (_) { } }
                else keep.push(item);
            });

            updateGalleryFabThumb();
            renderGallery();
        });

        const galleryDownloadBtn = document.getElementById('gallery-download');
        if (galleryDownloadBtn) galleryDownloadBtn.addEventListener('click', () => {
            const selected = galleryItems.filter((i) => i.selected);
            if (selected.length === 0) return;
            if (selected.length === 1) { downloadGalleryItem(selected[0]); return; }
            // Multiple items: navigator.share() throws if called again while a previous call
            // is still in flight, so staggered single-item shareOrDownloadBlob() calls (like
            // this used to do) would break after the first one. Share all of them in one call
            // instead — one tap in the sheet saves everything — falling back to downloading
            // them individually (plain <a download>, not another share()) if the browser
            // can't share multiple files together.

                    const files = selected.map((item) => new File([item.blob], item.fileName, { type: item.mimeType || item.blob.type }));
                    if (navigator.canShare({ files })) {
                        navigator.share({ files }).catch(() => {
                            selected.forEach((item, i) => setTimeout(() => downloadBlobDirect(item.blob, item.fileName), i * 300));
                        });
                        return;
                    }

            }

        });

            renderViewerItem();

        if (galleryViewerCloseBtn) galleryViewerCloseBtn.addEventListener('click', closeViewer);

        const galleryViewerDeleteBtn = document.getElementById('gallery-viewer-delete');
        if (galleryViewerDeleteBtn) galleryViewerDeleteBtn.addEventListener('click', () => {
            const item = galleryItems[viewerIndex];
            if (!item) return;
            try { URL.revokeObjectURL(item.url); } catch (_) { }
            galleryItems.splice(viewerIndex, 1);

            if (galleryItems.length === 0) { closeViewer(); }

        if (galleryViewerDownloadBtn) galleryViewerDownloadBtn.addEventListener('click', () => {

        // Swipe left/right on the viewer stage to move between captures

            const SWIPE_MIN = 40;
            stage.addEventListener('touchstart', (e) => {
                if (!e.touches || e.touches.length !== 1) { tracking = false; return; }
                tracking = true;
                sx = e.touches[0].clientX; sy = e.touches[0].clientY;
            }, { passive: true });
            stage.addEventListener('touchend', (e) => {
                if (!tracking) return;
                tracking = false;
                const t = e.changedTouches && e.changedTouches[0];
                if (!t) return;
                const dx = t.clientX - sx, dy = t.clientY - sy;
                if (Math.abs(dx) > SWIPE_MIN && Math.abs(dx) > Math.abs(dy) * 1.5) {

        // ═══════════════════════════════════════════════════
        //  SHUTTER SOUNDS — synthesized per camera (Web Audio, no audio files)
        // ═══════════════════════════════════════════════════
        // Each camera family gets the sound of its own mechanism, built from a few primitives:
        // filtered noise bursts (shutter blades, mirror slap, plastic clacks), a pitched-down
        // sine (body resonance "thump"), a sawtooth through a low-pass (film/print motors),
        // a vibrato sine (toy-camera spring twang) and runs of tiny clicks (wind levers,
        // thumbwheels, cranks). Played only for Live photo captures.
        const shutterSound = (function () {
            let ctx = null, out = null, bus = null, noiseBuf = null;

            function ac() {
                try {
                    if (!ctx) {
                        const C = window.AudioContext || window.webkitAudioContext;
                        if (!C) return null;
                        ctx = new C();
                        // Gentle limiter so stacked layers never clip.
                        const comp = ctx.createDynamicsCompressor();
                        comp.threshold.value = -10;
                        comp.ratio.value = 6;
                        out = ctx.createGain();
                        out.gain.value = 0.85;
                        out.connect(comp).connect(ctx.destination);
                    }
                    if (ctx.state === 'suspended') ctx.resume().catch(() => { });
                    return ctx;
                } catch (_) { return null; }
            }

            function noise(c) {
                if (!noiseBuf) {
                    noiseBuf = c.createBuffer(1, Math.floor(c.sampleRate * 1.5), c.sampleRate);
                    const d = noiseBuf.getChannelData(0);
                    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
                }
                return noiseBuf;
            }

            function env(g, t, peak, attack, dur) {
                g.gain.setValueAtTime(0.0001, t);
                g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + attack);
                g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            }

            // Filtered noise burst — blades, mirror, plastic.
            function burst(c, t, freq, dur, gain, q, type) {
                const s = c.createBufferSource();
                s.buffer = noise(c);
                const f = c.createBiquadFilter();
                f.type = type || 'bandpass';
                f.frequency.value = freq;
                f.Q.value = q || 1;
                const g = c.createGain();
                env(g, t, gain, 0.002, dur);
                s.connect(f).connect(g).connect(bus);
                s.start(t, Math.random() * 1.2);
                s.stop(t + dur + 0.03);
            }

            // Body resonance: a sine dropping in pitch.
            function thump(c, t, freq, dur, gain) {
                const o = c.createOscillator();
                o.type = 'sine';
                o.frequency.setValueAtTime(freq, t);
                o.frequency.exponentialRampToValueAtTime(freq * 0.5, t + dur);
                const g = c.createGain();
                env(g, t, gain, 0.004, dur);
                o.connect(g).connect(bus);
                o.start(t);
                o.stop(t + dur + 0.03);
            }

            // Motor (film advance / print eject): sawtooth through a low-pass, with a
            // fast tremolo for the gear chatter.
            function whir(c, t, freq, dur, gain, cutoff) {
                const o = c.createOscillator();
                o.type = 'sawtooth';
                o.frequency.setValueAtTime(freq * 0.8, t);
                o.frequency.linearRampToValueAtTime(freq, t + 0.08);
                o.frequency.setValueAtTime(freq, t + dur - 0.1);
                o.frequency.linearRampToValueAtTime(freq * 0.7, t + dur);
                const f = c.createBiquadFilter();
                f.type = 'lowpass';
                f.frequency.value = cutoff || 900;
                const g = c.createGain();
                g.gain.setValueAtTime(0.0001, t);
                g.gain.exponentialRampToValueAtTime(gain, t + 0.05);
                g.gain.setValueAtTime(gain, t + dur - 0.08);
                g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
                const lfo = c.createOscillator();
                lfo.frequency.value = 38;
                const depth = c.createGain();
                depth.gain.value = gain * 0.45;
                lfo.connect(depth).connect(g.gain);
                o.connect(f).connect(g).connect(bus);
                o.start(t); lfo.start(t);
                o.stop(t + dur + 0.03); lfo.stop(t + dur + 0.03);
            }

            // Toy-camera spring twang: a sine with vibrato, ringing out.
            function spring(c, t, freq, dur, gain) {
                const o = c.createOscillator();
                o.type = 'sine';
                o.frequency.value = freq;
                const lfo = c.createOscillator();
                lfo.frequency.value = 28;
                const depth = c.createGain();
                depth.gain.value = freq * 0.03;
                lfo.connect(depth).connect(o.frequency);
                const g = c.createGain();
                env(g, t, gain, 0.003, dur);
                o.connect(g).connect(bus);
                o.start(t); lfo.start(t);
                o.stop(t + dur + 0.03); lfo.stop(t + dur + 0.03);
            }

            // Wind lever / thumbwheel / crank: a run of tiny clicks.
            function ratchet(c, t, count, interval, freq, gain) {
                for (let i = 0; i < count; i++) {
                    burst(c, t + i * interval * (0.9 + Math.random() * 0.2), freq * (0.9 + Math.random() * 0.2), 0.012, gain, 3);
                }
            }

            const PROFILES = {
                // SLR: mirror up → curtain → mirror down, then the wind lever.
                slr(c, t) {
                    burst(c, t, 2400, 0.035, 0.9, 1.2); thump(c, t, 130, 0.08, 0.5);
                    burst(c, t + 0.045, 3600, 0.022, 0.7, 1.5);
                    burst(c, t + 0.085, 1800, 0.045, 0.75, 1.1); thump(c, t + 0.085, 95, 0.1, 0.45);
                    ratchet(c, t + 0.42, 9, 0.022, 3200, 0.22);
                },
                // Leica M rangefinder: the near-silent cloth-curtain whisper.
                leica(c, t) {
                    burst(c, t, 1400, 0.03, 0.4, 0.8); thump(c, t, 210, 0.05, 0.18);
                    burst(c, t + 0.02, 2200, 0.018, 0.2, 1);
                    ratchet(c, t + 0.45, 7, 0.026, 2600, 0.12);
                },
                // Premium/90s compact: soft leaf shutter, then the motor winds on.
                compact(c, t) {
                    burst(c, t, 4200, 0.016, 0.55, 2);
                    whir(c, t + 0.08, 190, 0.45, 0.09, 1100);
                },
                // Half-frame with a lever: crisp small click + short lever.
                halfframe(c, t) {
                    burst(c, t, 3000, 0.025, 0.6, 1.4); thump(c, t, 170, 0.05, 0.25);
                    ratchet(c, t + 0.35, 5, 0.024, 3000, 0.2);
                },
                // Disposable: plastic clack + spring, then the thumbwheel ratchet.
                disposable(c, t) {
                    burst(c, t, 2200, 0.032, 0.9, 2); spring(c, t, 1350, 0.07, 0.12);
                    ratchet(c, t + 0.32, 12, 0.045, 3100, 0.3);
                },
                // Lomo LC-A: small mechanical click and a thumbwheel advance.
                lomo(c, t) {
                    burst(c, t, 2800, 0.022, 0.75, 1.6); thump(c, t, 180, 0.04, 0.2);
                    ratchet(c, t + 0.33, 7, 0.04, 2900, 0.25);
                },
                // Holga / Diana: clunky plastic "ka-chunk" with a spring twang.
                toy(c, t) {
                    burst(c, t, 1200, 0.05, 0.95, 1.4); thump(c, t, 150, 0.09, 0.4);
                    spring(c, t + 0.01, 880, 0.13, 0.14);
                    burst(c, t + 0.07, 1700, 0.03, 0.5, 1.8);
                },
                // 70s Instamatic: spring shutter "kerchunk" + flick of the lever.
                instamatic(c, t) {
                    burst(c, t, 2000, 0.04, 0.85, 1.6); spring(c, t, 700, 0.1, 0.12);
                    ratchet(c, t + 0.3, 4, 0.05, 2400, 0.25);
                },
                // SX-70: click, mirror flap, then the long print-eject motor + end clunk.
                sx70(c, t) {
                    burst(c, t, 2600, 0.03, 0.8, 1.3); burst(c, t + 0.05, 1500, 0.04, 0.6, 1.1);
                    thump(c, t + 0.05, 110, 0.08, 0.3);
                    whir(c, t + 0.18, 115, 1.05, 0.16, 700);
                    burst(c, t + 1.24, 1300, 0.04, 0.45, 1.2);
                },
                // OneStep: point-and-shoot instant, slightly higher eject motor.
                onestep(c, t) {
                    burst(c, t, 3000, 0.025, 0.75, 1.5);
                    whir(c, t + 0.12, 145, 0.9, 0.15, 850);
                    burst(c, t + 1.03, 1500, 0.035, 0.35, 1.2);
                },
                // Instax: soft click, short whirring eject.
                instax(c, t) {
                    burst(c, t, 3400, 0.02, 0.6, 1.6);
                    whir(c, t + 0.1, 210, 0.6, 0.1, 1000);
                    burst(c, t + 0.72, 2000, 0.02, 0.25, 1.5);
                },
                // Hasselblad: the heavy mirror "ka-THUNK", then the crank.
                hasselblad(c, t) {
                    thump(c, t, 72, 0.2, 0.95); burst(c, t, 1300, 0.07, 1, 1);
                    burst(c, t + 0.11, 1900, 0.05, 0.75, 1.2); thump(c, t + 0.11, 85, 0.12, 0.5);
                    ratchet(c, t + 0.55, 5, 0.07, 1800, 0.35);
                },
                // Rolleiflex TLR: quiet leaf-shutter tick, then the crank.
                rollei(c, t) {
                    burst(c, t, 3800, 0.018, 0.5, 1.8); thump(c, t, 240, 0.04, 0.15);
                    ratchet(c, t + 0.4, 5, 0.065, 2000, 0.3);
                },
                // Super 8: the motor and gate running film for half a second.
                super8(c, t) {
                    whir(c, t, 90, 0.55, 0.12, 600);
                    ratchet(c, t + 0.02, 10, 1 / 18, 2400, 0.3);
                },
            };

            // Which mechanism each camera has (anything unlisted is an SLR).
            const CAMERA_SOUND = {
                ae1: 'slr', fm2: 'slr', k1000: 'slr', om1: 'slr',
                leicam3: 'leica',
                contaxt2: 'compact', mju: 'compact', t4: 'compact',
                penf: 'halfframe',
                disposable: 'disposable',
                lca: 'lomo',
                holga: 'toy', diana: 'toy',
                instamatic: 'instamatic',
                sx70: 'sx70', onestep: 'onestep', instaxmini: 'instax',
                hasselblad: 'hasselblad', rollei: 'rollei',
                super8: 'super8',
            };

            // Loudness trim per mechanism, measured from offline renders so every camera
            // lands at a similar peak — except the Leica, kept deliberately the quietest
            // (its near-silent shutter is the point).
            const PROFILE_GAIN = {
                slr: 1, leica: 2.5, compact: 2.6, halfframe: 5, disposable: 4, lomo: 5.5,
                toy: 3.4, instamatic: 4.5, sx70: 1.6, onestep: 1.7, instax: 2.4,

        // Shutter: in live mode → snapshot (image) or start/stop video; only visible in Live

            let deferredPrompt = null;

            window.addEventListener('beforeinstallprompt', function (e) {
                e.preventDefault();
                deferredPrompt = e;
            });

            function showManualHint() {
                if (!manualHint) return;
                if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
                    manualHint.textContent = 'In Safari: tap Share (□↑), then "Add to Home Screen", then Add.';
                } else {
                    manualHint.textContent = 'Use your browser menu: ⋮ → "Add to Home screen" or "Install app".';
                }
                manualHint.style.display = 'block';
            }

            function showInstallSteps() {
                if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
                    alert('To add Film Camera to your home screen:\n\n1. Tap the Share button (□ with arrow) at the bottom of Safari.\n2. Scroll down and tap "Add to Home Screen".\n3. Tap "Add".');
                } else {
                    showManualHint();
                }
            }

            if (installBtn) installBtn.addEventListener('click', function () {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    deferredPrompt.userChoice.then(function (r) {
                        if (r.outcome === 'accepted') { installEl.classList.remove('show'); initApp(); }
                        deferredPrompt = null;
                    });
                } else {
                    showInstallSteps();
                }
            });
            if (skipBtn) skipBtn.addEventListener('click', function () {
                installEl.classList.remove('show');
                try { sessionStorage.setItem('filmcamera-skip-install', '1'); } catch (_) { }
                initApp();
            });

            function revealInstallPrompt() {
                installEl.setAttribute('aria-hidden', 'false');
                installEl.classList.add('show');
                if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) showManualHint();
            }

            // The splash always plays first, camera/install permission requests included —
            // it should never look like they're popping up out of nowhere before the app has
            // shown any UI at all. What comes right after it depends on whether this visitor
            // should still see the "Add to Home Screen" screen.
            function proceedPastSplash() {
                if (installEl && isMobile && !isStandalone) {
                    try {
                        if (sessionStorage.getItem('filmcamera-skip-install')) { initApp(); return; }
                    } catch (_) { }
                    revealInstallPrompt();
                    return;
                }
                initApp();
            }
            playSplashThen(proceedPastSplash);
        })();

        // Splash: logo entrance animation, then the app name typed out, then waits for a tap
        // anywhere on it before fading into whatever comes next (the install prompt, or
        // straight into the app for a standalone/already-decided visitor). Always plays,
        // every launch, standalone/installed included — it used to be gated the same way as
        // the install prompt, which meant a visitor using the installed home-screen icon
        // never saw it at all, going straight to the camera permission dialog with no
        // preceding UI. Tap-gated rather than auto-advancing so that whatever permission
        // prompt follows (camera, or "Add to Home Screen") only ever appears after the user
        // has acknowledged the app opening, never popping up out of nowhere on its own timer.
        // Purely presentational — no state, no persistence — so it's a plain function rather
        // than something wired into `state`.
        function playSplashThen(next) {
            const splash = document.getElementById('splash-screen');
            const title = document.getElementById('splash-title');
            const hint = document.getElementById('splash-hint');
            if (!splash || !title) { next(); return; }
            const APP_NAME = 'Film Camera';
            let advanced = false;
            function advance() {
                if (advanced) return;
                advanced = true;
                // The splash tap is the first user gesture — start the audio context here
                // so iOS allows the shutter sounds later.
                if (typeof shutterSound !== 'undefined') shutterSound.unlock();
                splash.removeEventListener('click', advance);
                splash.classList.add('fade-out');
                setTimeout(() => {
                    splash.classList.remove('show', 'fade-out');
                    splash.setAttribute('aria-hidden', 'true');
                    if (hint) hint.classList.remove('show');
                    next();
                }, 500); // matches the CSS opacity transition duration
            }
            splash.setAttribute('aria-hidden', 'false');
            splash.classList.add('show');
            title.textContent = '';
            title.classList.add('caret');
            // Let the logo's own entrance animation (600ms) play out before typing starts.
            setTimeout(() => {
                let i = 0;
                const typeInterval = setInterval(() => {
                    i++;
                    title.textContent = APP_NAME.slice(0, i);
                    if (i >= APP_NAME.length) {
                        clearInterval(typeInterval);
                        setTimeout(() => {
                            title.classList.remove('caret');
                            if (hint) hint.classList.add('show');
                            splash.addEventListener('click', advance);
                        }, 300); // caret keeps blinking a beat after the last character
                    }
                }, 70);
            }, 650);
        }

        // Wraps the app's real startup (defaulting into Live, which is what actually
        // requests camera permission) — called only once the splash (and, if shown, the
        // install prompt) has been dismissed, never automatically on page load, so the
        // permission dialog always comes after some acknowledged UI rather than cold.
        let appInitialized = false;
        function initApp() {
            if (appInitialized) return;
            appInitialized = true;
            switchToMode('live');
            if (typeof updateMobileButtonsForMode === 'function') updateMobileButtonsForMode();
        }
    </script>
</body>

</html>
