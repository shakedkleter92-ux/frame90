<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Phone-only format: on a wide (desktop/tablet) top-level window, redirect to frame.html,
         which re-embeds this same page inside a fixed phone-shaped iframe so the app always
         renders as if on a phone. Real phones (already narrow) and the embedded instance
         itself (?pmFrame=1) skip this and render normally. -->
    <script>
        (function () {
            try {
                if (window.self !== window.top) return;
                var qp = new URLSearchParams(location.search);
                if (qp.has('pmFrame')) return;
                if (window.innerWidth <= 700) return;
                location.replace('frame.html' + location.search + location.hash);
            } catch (e) { }
        })();
    </script>
    <meta name="theme-color" content="#4a3942" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Film Camera" />
    <title>Film Camera</title>
    <!-- Social / share preview -->
    <meta property="og:title" content="Film Camera" />
    <meta property="og:description" content="shoot it on film" />
    <meta property="og:image" content="icon.svg" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Film Camera" />
    <meta name="twitter:description" content="shoot it on film" />
    <meta name="twitter:image" content="icon.svg" />
    <link rel="manifest" href="manifest.json" />
    <!-- אייקון למסך הבית — משתמש באייקון מהתיקייה -->
    <link rel="icon" type="image/svg+xml" href="icon.svg?v=3" />
    <link rel="apple-touch-icon" href="icon-180.png?v=3" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=IBM+Plex+Mono:wght@700&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        :root {
            /* VHS-sleeve palette: cream paper, deep plum ink, and the sunset stripe run
               (lime → yellow → orange → red → pink → magenta → purple) as the accent. */
            --bg: #f2ebe0;
            --cream: #f2ebe0;
            --plum: #4a3942;
            --plum-deep: #2e2329;
            /* Shades over the cream background (Upload, gallery) — translucent plum tints,
               not grey, so everything stays in the sleeve's two-color world. */
            --panel: rgba(74, 57, 66, .08);
            --surface: rgba(74, 57, 66, .16);
            --border: #4a3942;
            --text: #4a3942;
            --muted: #8b7682;
            /* Floating controls over the camera feed: frosted, see-through cream. */
            --fab-bg: rgba(242, 235, 224, .42);
            --fab-blur: blur(14px) saturate(150%);
            --zoom-accent: #ec7a2f;
            --radius: 14px;
            --radius-sm: 10px;
            --pill: 999px;
            --stripes: linear-gradient(180deg, #d7df5a 0 12.5%, #f6d34a 12.5% 25%, #f6a83c 25% 37.5%, #f27f37 37.5% 50%, #ec5a40 50% 62.5%, #d9475a 62.5% 75%, #a8406c 75% 87.5%, #74385f 87.5% 100%);
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            font-family: 'Outfit', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text)
        }

        #app {
            display: flex;
            height: 100vh;
            width: 100vw
        }

        /* Panel */
        #panel {
            width: 270px;
            min-width: 250px;
            background: var(--panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent
        }

        /* Desktop-only section (mode switch lives in panel only on desktop) */
        .desktop-mode-switch {
            display: block;
        }

        @media (max-width: 1024px) {
            .desktop-mode-switch {
                display: none !important;
            }
        }

        #panel-header {
            padding: 18px 20px 14px;
            border-bottom: 1px solid var(--border)
        }

        #panel-header h1 {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase
        }

        #panel-header p {
            font-size: 9px;
            color: var(--muted);
            margin-top: 3px;
            letter-spacing: .05em
        }

        /* Desktop: show panel header (app title) */
        @media (min-width: 1025px) {
            #panel-header {
                display: block;
            }
        }
        /* Mobile/tablet: keep header hidden */
        @media (max-width: 1024px) {
            #panel-header {
                display: none;
            }
        }

        /* Desktop: keep panel visible in all modes */

        .section {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border)
        }

        .section:last-child {
            border-bottom: none
        }

        .sec-label {
            font-size: 8px;
            font-weight: 700;
            letter-spacing: .2em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px
        }

        /* A sec-label sharing a slider's row (e.g. Resolution) acts as that slider's
           label instead of a stacked heading — no bottom margin, no shrinking/wrapping. */
        .slider-row>.sec-label {
            margin-bottom: 0;
            flex-shrink: 0;
            white-space: nowrap;
        }

        .sec-num {
            font-size: 8px;
            color: var(--text);
            opacity: .35
        }

        /* Sliders */
        .slider-row {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-top: 10px;
            margin-bottom: 7px
        }

        /* Keep stacked sliders tight, but add space after button groups */
        .slider-row+.slider-row {
            margin-top: 0;
        }

        .slider-row:last-child {
            margin-bottom: 0
        }

        .sl-label {
            font-size: 9px;
            color: var(--muted);
            min-width: 58px
        }

        .sl-val {
            font-size: 9px;
            font-weight: 600;
            min-width: 32px;
            text-align: right
        }

        input[type=range] {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 1px;
            background: var(--border);
            outline: none;
            cursor: pointer
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            border-radius: var(--radius);
            background: var(--text);
            cursor: pointer
        }

        /* Color rows */
        .color-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 7px
        }

        .color-row:last-child {
            margin-bottom: 0
        }

        .color-row label {
            font-size: 9px;
            color: var(--muted);
            flex: 1
        }


        .film-presets-wrap {
            display: flex;
            align-items: stretch;
            gap: 6px;
            margin-bottom: 8px;
        }

        .film-presets {
            display: grid;
            /* minmax(0, 1fr), not a plain 1fr — a plain 1fr column won't shrink below its
               content's intrinsic width, so a long un-ellipsized label (before .pal-tgt's
               own overflow:hidden even gets a chance to apply) could widen the whole grid
               past its container and trigger a stray horizontal scrollbar alongside the
               intended vertical one. */
            grid-template-columns: repeat(4, minmax(0, 1fr));
            grid-auto-rows: min-content;
            gap: 4px;
            flex: 1;
            min-width: 0;
            /* Capped to ~3 rows — there can be many presets once the film list
               grows, and showing them all at once made the panel very tall. Scrolls for
               the rest instead of pushing the rest of the panel (or the screen) down. */
            max-height: 78px;
            overflow-x: hidden;
            overflow-y: auto;
            /* The real scroll indicator is .grid-scrollbar below, not this native one —
               iOS Safari's overlay scrollbars ignore ::-webkit-scrollbar styling entirely
               (border-radius:0 on the thumb never actually took effect there), so the native
               one is hidden rather than relied on for the square look. */
            scrollbar-width: none;
        }

        .film-presets::-webkit-scrollbar {
            display: none;
        }

        /* Custom square scroll indicator — a plain styled <div>, not a browser scrollbar, so
           its shape is guaranteed everywhere instead of depending on per-browser scrollbar
           styling support. Positioned/sized by JS (syncPickerScrollbar()) from
           its list's actual scrollTop/scrollHeight. Hidden via inline display:none
           when everything already fits with no scrolling needed. */
        .grid-scrollbar {
            display: none;
            flex: 0 0 auto;
            width: 5px;
            background: var(--surface);
            position: relative;
        }

        .grid-scrollbar-thumb {
            position: absolute;
            left: 0;
            width: 100%;
            background: var(--text);
            border-radius: var(--radius);
        }

        /* Fixed grid = every preset button is the same size no matter its label's length
           or how many presets there are; long labels are clipped with an ellipsis instead
           of stretching their button. */
        .pal-tgt {
            padding: 6px 2px;
            border: none;
            background: var(--bg);
            font-size: 8px;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
            text-align: center;
            cursor: pointer;
            color: var(--muted);
            transition: background .12s, color .12s, transform .12s;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        @media (hover:hover) {
            .pal-tgt:hover {
                background: var(--surface);
                color: var(--text);
            }
        }

        .pal-tgt.active {
            background: var(--text);
            color: var(--bg);
        }

        input[type=color] {
            width: 30px;
            height: 22px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: none;
            padding: 1px;
            cursor: pointer
        }

        /* Fill mode switch */
        #fill-mode {
            display: flex;
            margin-bottom: 10px
        }

        .fm-btn {
            flex: 1;
            padding: 8px 6px;
            border: none;
            border-radius: var(--radius);
            background: var(--bg);
            font-size: 9px;
            font-weight: 600;
            letter-spacing: .09em;
            text-transform: uppercase;
            cursor: pointer;
            font-family: 'Outfit', system-ui, sans-serif;
            color: var(--muted);
            transition: background .12s, color .12s, transform .12s
        }

        .fm-btn:first-child {
            border-right: none
        }

        .fm-btn.active {
            background: var(--text);
            color: var(--bg)
        }

        /* Upload drop zone: overlays the canvas in #main (Image mode, no photo yet) */
        #upload-zone {
            position: absolute;
            inset: 0;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: var(--bg);
        }

        #drop-zone {
            width: 100%;
            max-width: 220px;
            aspect-ratio: 1 / 1;
            border: 1px solid rgba(0, 0, 0, .25);
            border-radius: var(--radius);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            position: relative;
            transition: background .15s;
        }

        #drop-zone:hover,
        #drop-zone.drag-over {
            background: var(--surface)
        }

        .dz-input {
            position: absolute;
            inset: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer
        }

        .dz-text {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.6
        }

        #file-name {
            margin-top: 6px;
            font-size: 11px;
            font-weight: 600;
            word-break: break-all
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: var(--radius);
            font-size: 9px;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
            cursor: pointer;
            font-family: 'Outfit', system-ui, sans-serif;
            transition: background .12s, color .12s, transform .12s;
            margin-bottom: 5px
        }

        /* Unified button interactions (like top dock): subtle scale on hover/press */
        button,
        .btn,
        .fm-btn,
        .pal-tgt,
        #panel-toggle-bar,
        #mob-shutter,
        #mob-upload-more,
        #mob-flip,
        .mob-mode-label,
        .mob-zoom-preset,
        #mob-download,
        #mob-ratio,
        #mob-gallery {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        /* iOS sometimes tints button text blue — force monochrome UI */
        button {
            /* Keep author-defined color, just prevent iOS blue tint */
            -webkit-text-fill-color: currentColor;
        }

        /* Active buttons must invert text color (iOS needs explicit override) */
        .pal-tgt.active,
        .fm-btn.active {
            color: var(--bg) !important;
            -webkit-text-fill-color: var(--bg) !important;
        }

        .btn:active,
        .fm-btn:active,
        .pal-tgt:active,
        #panel-toggle-bar:active,
        #mob-shutter:active,
        #mob-upload-more:active,
        #mob-flip:active,
        .mob-mode-label:active,
        .mob-zoom-preset:active,
        #mob-download:active,
        #mob-ratio:active,
        #mob-gallery:active {
            transform: scale(.97);
        }

        @media (hover:hover) {

            .btn:hover,
            .fm-btn:hover,
            .pal-tgt:hover,
            #panel-toggle-bar:hover,
            #mob-shutter:hover,
            #mob-upload-more:hover,
            #mob-flip:hover,
            .mob-mode-label:hover,
            #mob-download:hover,
            #mob-ratio:hover,
            #mob-gallery:hover {
                transform: scale(1.02);
                background: var(--surface);
            }
        }

        .btn:last-child {
            margin-bottom: 0
        }

        /* Only show inside panel on desktop; mobile uses floating undo */
        .desktop-only {
            display: block;
        }

        @media (max-width: 700px) {
            .desktop-only {
                display: none !important;
            }
        }

        /* ───── Tablet layout (drawer like mobile) ───── */
        @media (min-width: 701px) and (max-width: 1024px) {

            html,
            body {
                overflow: hidden;
                height: 100%
            }

            #app {
                flex-direction: column;
                height: 100dvh;
                overflow: hidden;
                padding-top: 0;
                box-sizing: border-box;
            }

            /* Canvas area fills the top (above bottom bar) */
            #main {
                position: fixed;
                /* Keep canvas flush under the fixed top header (no jump on panel open) */
                top: 48px;
                left: 0;
                right: 0;
                bottom: 68px;
                z-index: 0;
                height: auto;
                min-height: 0;
            }

            #grid-canvas {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
            }

            /* Panel becomes a sliding drawer from the bottom */
            #panel {
                position: fixed;
                bottom: 68px;
                left: 0;
                right: 0;
                width: 100%;
                min-width: unset;
                max-height: 0;
                overflow: hidden;
                border-right: none;
                border-top: 1px solid var(--border);
                z-index: 90;
                transition: max-height .35s cubic-bezier(.4, 0, .2, 1)
            }

            #panel.panel-open {
                max-height: 40vh;
                overflow-y: auto;
                /* Always sit above every floating control (mode header, shutter, zoom, etc.) */
                z-index: 200;
                background: rgba(255, 255, 255, 0.3);
                -webkit-backdrop-filter: blur(14px) saturate(140%);
                backdrop-filter: blur(14px) saturate(140%);
                isolation: isolate;
                color: var(--text);
            }

            #panel.panel-open .section {
                background: rgba(255, 255, 255, 0.1);
            }

            /* Canvas stays full-size and fixed; the panel is a translucent overlay
               that slides up over it, not a layout that pushes/shrinks it. */

            /* Show toggle bar */
            #panel-toggle-bar {
                display: flex
            }

            /* Hide desktop-only controls */
            .desktop-only {
                display: none !important;
            }
        }

        .btn-fill {
            background: var(--text);
            color: var(--bg)
        }

        .btn-fill:hover {
            background: var(--muted)
        }

        .btn-fill:disabled {
            opacity: .35;
            cursor: not-allowed
        }

        .btn-outline {
            background: var(--panel);
            color: var(--muted)
        }

        .btn-outline:hover {
            background: var(--surface);
            color: var(--text)
        }

        /* Canvas area */
        #main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            position: relative;
            overflow: hidden
        }


        #grid-canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1
        }

        /* Live: canvas full viewport – 9:16 fills screen, header/bar stay on top */
        body.live-fullscreen #grid-canvas {
            position: fixed !important;
            left: 0 !important;
            top: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            height: 100dvh !important;
            z-index: 1;
        }

        /* Recording timer — top-center, only while actually recording video */
        #mob-rec-timer {
            display: none;
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 130;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, .55);
            border-radius: var(--radius);
            padding: 5px 10px;
            font-family: 'Outfit', system-ui, sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .05em;
            color: #fff;
            -webkit-text-fill-color: #fff;
        }

        #mob-rec-timer::before {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff2b2b;
        }

        /* ───── Mobile top bar & panel toggle ───── */
        /* This used to be a full-width bar (before that, at the bottom); it's now just a
           square FAB, same size/treatment as the other floating buttons, floating over the
           canvas instead of reserving its own strip of screen. The panel it opens still
           slides down from the very top of the screen, so this sits ABOVE it in z-index
           (higher than the open panel's 200) to stay visible/clickable for closing it again. */
        #panel-toggle-bar {
            display: none;
            position: fixed;
            width: 40px;
            height: 40px;
            top: 20px;
            right: 20px;
            border: none;
            border-radius: var(--radius);
            background: var(--fab-bg);
            z-index: 210;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
            color: var(--muted);
            transition: background .12s, transform .12s;
        }

        /* Upload's backdrop is the plain white canvas, not a camera feed — same reasoning
           as the other FABs in the shared block below, repeated here since this rule needs
           to stay self-contained for its z-index override to reliably win the cascade. */
        body.mode-upload #panel-toggle-bar {
            background: var(--panel);
        }

        body.mode-upload #panel-toggle-bar:active {
            background: var(--surface);
        }

        /* Hidden while the panel is open — closing is by tapping anywhere outside it
           instead, so the panel can use the space the toggle used to keep floating over,
           and the live canvas stays visible behind it. */
        body.panel-open #panel-toggle-bar {
            display: none !important;
        }

        @media (hover: hover) {

            body.mode-upload #panel-toggle-bar:hover {
                background: var(--surface);
            }
        }

        #panel-toggle-bar.active {
            background: var(--text);
            color: var(--bg);
        }

        #panel-toggle-bar.active #panel-toggle-icon {
            color: var(--bg);
        }

        /* Gallery: full-screen, same light theme as the rest of the app (white background,
           black = active/selected — no separate dark theme for this screen). */
        #gallery-screen {
            position: fixed;
            inset: 0;
            z-index: 300;
            background: var(--bg);
            display: flex;
            flex-direction: column;
        }

        #gallery-header {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
        }

        #gallery-close {
            background: transparent;
            border: none;
            color: var(--text);
            -webkit-text-fill-color: var(--text);
            font-size: 16px;
            cursor: pointer;
            padding: 0;
            width: 24px;
            height: 24px;
        }

        #gallery-title {
            flex: 1;
            font-family: 'Outfit', system-ui, sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .15em;
            color: var(--text);
            -webkit-text-fill-color: var(--text);
        }

        #gallery-count {
            font-family: 'Outfit', system-ui, sans-serif;
            font-size: 10px;
            color: var(--muted);
            -webkit-text-fill-color: var(--muted);
        }

        /* Selection is a distinct mode you opt into (a real tap target — the whole thumbnail
           — instead of a tiny corner circle that's easy to miss and instead opens the
           viewer). Off by default; toggling it on reveals the check circles below. */
        #gallery-select-toggle {
            background: transparent;
            border: none;
            padding: 4px 0;
            cursor: pointer;
            font-family: 'Outfit', system-ui, sans-serif;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--muted);
            -webkit-text-fill-color: var(--muted);
        }

        #gallery-select-toggle.active {
            color: var(--zoom-accent);
            -webkit-text-fill-color: var(--zoom-accent);
        }

        #gallery-grid {
            flex: 1;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            /* Without this, when there are few enough items that the grid (flex:1, so it
               fills the whole screen) has leftover height, the browser spreads that extra
               space across the row tracks instead of leaving it after the last row — rows
               end up far taller than their square items, reading as a huge gap between rows
               with the next row's thumbnails pushed way down. Packing rows at the top keeps
               every row exactly as tall as its items, with any leftover space where it
               belongs: below the last row, same as any normal photo gallery with few shots. */
            align-content: start;
            gap: 2px;
            padding: 2px;
        }

        #gallery-empty {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Outfit', system-ui, sans-serif;
            font-size: 11px;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .gallery-item {
            position: relative;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            cursor: pointer;
            background: var(--surface);
        }

        .gallery-item img,
        .gallery-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .gallery-item .gallery-video-badge {
            position: absolute;
            bottom: 4px;
            right: 4px;
            font-size: 12px;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0, 0, 0, .8);
        }

        /* Only shown once #gallery-screen.select-mode is on (via the header's Select toggle)
           — outside select mode, tapping anywhere on a thumbnail opens the full-screen
           viewer, so there's nothing to show here. */
        .gallery-item .gallery-check {
            display: none;
            position: absolute;
            top: 6px;
            right: 6px;
            width: 20px;
            height: 20px;
            border-radius: var(--radius);
            border: 1.5px solid #fff;
            background: rgba(0, 0, 0, .35);
        }

        #gallery-screen.select-mode .gallery-item .gallery-check {
            display: block;
        }

        .gallery-item.selected .gallery-check {
            background: var(--text);
            border-color: var(--text);
        }

        .gallery-item.selected::after {
            content: '';
            position: absolute;
            inset: 0;
            border: 3px solid var(--text);
            pointer-events: none;
        }

        /* Only shown in select mode — nothing to batch-act on otherwise. */
        #gallery-actions {
            display: none;
            flex: 0 0 auto;
            gap: 8px;
            padding: 12px 16px;
            border-top: 1px solid var(--border);
        }

        #gallery-screen.select-mode #gallery-actions {
            display: flex;
        }

        #gallery-actions .btn {
            width: auto;
            flex: 1;
            margin-bottom: 0;
        }

        #gallery-actions .btn:disabled {
            opacity: .35;
            cursor: default;
        }

        /* Full-screen single-item viewer: tap a thumbnail to open, swipe left/right to
           move between items, Delete/Download act on just the one being viewed. */
        #gallery-viewer {
            position: fixed;
            inset: 0;
            z-index: 310;
            background: var(--bg);
            display: flex;
            flex-direction: column;
        }

        #gallery-viewer-header {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
        }

        #gallery-viewer-close {
            background: transparent;
            border: none;
            color: var(--text);
            -webkit-text-fill-color: var(--text);
            font-size: 16px;
            cursor: pointer;
            padding: 0;
            width: 24px;
            height: 24px;
        }

        #gallery-viewer-count {
            flex: 1;
            font-family: 'Outfit', system-ui, sans-serif;
            font-size: 10px;
            color: var(--muted);
            -webkit-text-fill-color: var(--muted);
            text-align: right;
        }

        #gallery-viewer-stage {
            flex: 1;
            position: relative;
            overflow: hidden;
            touch-action: pan-y;
        }

        #gallery-viewer-stage img,
        #gallery-viewer-stage video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: var(--bg);
        }

        #gallery-viewer-actions {
            flex: 0 0 auto;
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            border-top: 1px solid var(--border);
        }

        #gallery-viewer-actions .btn {
            width: auto;
            flex: 1;
            margin-bottom: 0;
        }

        /* Gallery FAB shows the latest capture as a thumbnail, like a phone camera's
           roll shortcut, once there's at least one. */
        #mob-gallery.has-thumb {
            padding: 0;
            overflow: hidden;
        }

        /* Before the first shot: an empty film frame, so it still reads as "your photos go
           here" rather than a generic grid icon. */
        .gallery-empty-frame {
            width: 20px;
            height: 20px;
            border: 1.5px solid var(--text);
            opacity: .55;
        }

        .gallery-fab-video {
            position: absolute;
            right: 3px;
            bottom: 2px;
            font-size: 9px;
            color: #fff;
            -webkit-text-fill-color: #fff;
            text-shadow: 0 1px 2px rgba(0, 0, 0, .8);
        }

        #mob-gallery.pop {
            animation: gallery-pop .35s cubic-bezier(.2, .9, .3, 1.3);
        }

        @keyframes gallery-pop {
            0% {
                transform: scale(.6);
            }

            100% {
                transform: scale(1);
            }
        }

        #mob-gallery.has-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Export preview modal */
        #export-modal {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 200;
            background: rgba(0, 0, 0, 0.35);
            -webkit-backdrop-filter: blur(10px) saturate(120%);
            backdrop-filter: blur(10px) saturate(120%);
        }

        #export-modal.open {
            display: flex;
        }

        .export-modal-card {
            width: min(920px, 100%);
            max-height: min(88vh, 900px);
            background: rgba(255, 255, 255, 0.72);
            -webkit-backdrop-filter: blur(14px) saturate(140%);
            backdrop-filter: blur(14px) saturate(140%);
            border: 1px solid var(--border);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
        }

        /* top bar removed */
        .export-modal-top {
            display: none;
        }

        .export-modal-title {
            display: none;
        }

        .export-modal-body {
            padding: 14px;
            overflow: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.25);
        }

        #export-preview-canvas {
            max-width: 100%;
            max-height: 70vh;
            width: auto;
            height: auto;
            border: 1px solid rgba(0, 0, 0, 0.12);
            background: #fff;
        }

        #export-preview-video {
            max-width: 100%;
            max-height: 70vh;
            width: 100%;
            height: auto;
            border: 1px solid rgba(0, 0, 0, 0.12);
            background: #000;
        }

        .export-modal-actions {
            padding: 12px 14px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* Action buttons: small, side-by-side, stay inside card */
        .export-modal-actions .btn {
            padding: 10px 12px;
            font-size: 10px;
            letter-spacing: .12em;
            text-transform: uppercase;
            min-width: 120px;
        }

        @media (max-width: 700px) {
            .export-modal-actions {
                justify-content: space-between;
                flex-wrap: nowrap;
            }

            .export-modal-actions .btn {
                min-width: 0;
                flex: 1;
            }
        }

        /* ───── Responsive breakpoints ───── */
        @media (max-width: 700px) {

            html,
            body {
                overflow: hidden;
                height: 100%
            }

            #app {
                flex-direction: column;
                height: 100dvh;
                overflow: hidden;
                /* Top dock is overlay (fixed), don't reserve space */
                padding-top: 0;
                box-sizing: border-box;
            }

            /* Canvas area fills the whole screen (no white margins; nothing is reserved at
               top or bottom anymore — every control, including the menu toggle, is a
               floating overlay, not part of layout flow) */
            #main {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                z-index: 0;
                height: auto;
                min-height: 0;
            }

            #grid-canvas {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
            }

            /* Panel becomes a sliding drawer from the very top of the screen — the toggle
               button that opens it is a floating overlay above it (z-index 210 > 200), not a
               bar reserving its own space, so the panel itself starts flush at the top. */
            #panel {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                width: 100%;
                min-width: unset;
                max-height: 0;
                overflow: hidden;
                border-right: none;
                z-index: 90;
                transition: max-height .35s cubic-bezier(.4, 0, .2, 1)
            }

            #panel.panel-open {
                max-height: 40vh;
                overflow-y: auto;
                /* Always sit above every floating control (mode header, shutter, zoom, etc.) */
                z-index: 200;
                /* Much more see-through than before, on purpose — the live canvas behind it
                   should stay genuinely visible, not just a colored blur. Lighter frost
                   (lower opacity, much less blur) than the old "readable glass panel" look. */
                background: rgba(255, 255, 255, 0.12);
                -webkit-backdrop-filter: blur(4px) saturate(140%);
                backdrop-filter: blur(4px) saturate(140%);
                isolation: isolate;
                color: var(--text);
            }

            #panel.panel-open .sec-label,
            #panel.panel-open .sl-label,
            #panel.panel-open .sl-val,
            #panel.panel-open label,
            #panel.panel-open input:not([type="range"]),
            #panel.panel-open .sec-num,
            #panel.panel-open .picker-info {
                color: var(--text);
            }

            #panel.panel-open .mob-fm-btn:not(.active) {
                color: var(--text);
            }

            #panel.panel-open::before {
                content: '';
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                /* subtle dim behind the frosted panel */
                background: rgba(0, 0, 0, 0.06);
                z-index: -1;
                pointer-events: none;
            }

            #panel.panel-open>* {
                position: relative;
                z-index: 1;
            }

            #panel.panel-open .section {
                background: rgba(255, 255, 255, 0.1);
            }

            /* הקנבס נשאר קבוע במקום ובגודל שלו; הפאנל הוא overlay שקוף-למחצה
               שעולה מעליו ויורד, ולא שינוי פריסה שדוחף/מקטין אותו. */

            /* Show toggle bar */
            #panel-toggle-bar {
                display: flex
            }

            /* במובייל – בלי כפילות: Snapshot ו-Flip כבר בחוץ */
            #l-snapshot,
            #l-flip-cam {
                display: none !important;
            }

            /* Larger controls on mobile */
            .section {
                padding: 14px 16px
            }

            #panel-header {
                padding: 14px 16px 12px
            }

            #panel-header h1 {
                font-size: 14px
            }

            #panel-header p {
                font-size: 11px
            }

            .sec-label {
                font-size: 11px;
                margin-bottom: 10px
            }

            .sl-label {
                min-width: 64px;
                font-size: 11px
            }

            .sl-val {
                min-width: 36px;
                font-size: 11px
            }

            .slider-row {
                gap: 10px;
                margin-bottom: 10px
            }

            input[type=range]::-webkit-slider-thumb {
                width: 16px;
                height: 16px;
                border-radius: var(--radius)
            }

            .color-row label {
                font-size: 11px
            }

            input[type=color] {
                width: 40px;
                height: 32px
            }

            .fm-btn {
                padding: 12px 6px;
                font-size: 11px
            }

            /* במובייל: כפתורי Upload/Live רק ב-header העליון, לא בתפריט */
            .fill-mode-switcher {
                display: none
            }

            .btn {
                padding: 14px;
                font-size: 11px
            }

            .dz-text {
                font-size: 11px
            }

            /* Hide export section inside panel on mobile — FAB handles it */
            .section:has(#dl-both) {
                display: none
            }
        }

        /* Tablet / large phones: show mobile docks too (layout stays desktop) */
        @media (max-width: 1024px) {
            #panel-toggle-bar {
                display: flex;
            }
        }

        /* ─── Floating Action Button (mobile download / camera flip) ─── */
        /* ─── Mobile Camera Buttons ─── */

        /* Base: hidden on desktop — square, same stroke as panel */
        #mob-shutter,
        #mob-upload-more,
        #mob-flip,
        #mob-download,
        #mob-ratio,
        #mob-gallery {
            display: none;
            position: fixed;
            border-radius: var(--radius);
            cursor: pointer;
            border: none;
            background: var(--fab-bg);
            transition: background .12s, transform .12s;
            z-index: 85
        }

        /* Upload's backdrop is the plain white canvas, not a camera feed — the FABs'
           translucent white would otherwise blend into it. Give them a real static shade
           there, with a darker one for hover/press (no drop shadows anywhere per design). */
        body.mode-upload #mob-gallery,
        body.mode-upload #mob-download,
        body.mode-upload #mob-upload-more {
            background: var(--panel);
        }

        body.mode-upload #mob-gallery:active,
        body.mode-upload #mob-download:active,
        body.mode-upload #mob-upload-more:active {
            background: var(--surface);
        }

        @media (hover: hover) {

            body.mode-upload #mob-gallery:hover,
            body.mode-upload #mob-download:hover,
            body.mode-upload #mob-upload-more:hover {
                background: var(--surface);
            }
        }

        #mob-shutter:active,
        #mob-upload-more:active,
        #mob-flip:active,
        #mob-download:active,
        #mob-ratio:active,
        #mob-gallery:active {
            transform: scale(.97)
        }

        /* Mode-row container: transparent — only the active label gets a pill background */
        #mob-capture-mode {
            border: none;
            box-shadow: none;
            background: transparent;
        }

        /* Shutter — גובה 58px, מרכז תחתון */
        #mob-shutter {
            width: 58px;
            height: 58px;
            left: 50%;
            transform: translateX(-50%);
            bottom: 20px
        }

        #mob-shutter:active {
            transform: translateX(-50%) scale(.88)
        }

        @media (hover:hover) {

            /* Keep centered on hover (don't lose translateX) */
            #mob-shutter:hover {
                transform: translateX(-50%) scale(1.02);
            }
        }

        /* Upload's shutter-equivalent — same size/position, an up-arrow instead of a
           capture circle, always available (even with an image already loaded) so there's
           a way to replace it. */
        #mob-upload-more {
            width: 44px;
            height: 44px;
            left: 50%;
            transform: translateX(-50%);
            bottom: 27px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            font-size: 18px;
            line-height: 1;
            color: var(--text);
        }

        #mob-upload-more:active {
            transform: translateX(-50%) scale(.88)
        }

        @media (hover:hover) {

            #mob-upload-more:hover {
                transform: translateX(-50%) scale(1.02);
            }
        }

        /* Inner square — smaller, centered, with clear gap from outer frame */
        #mob-shutter::before {
            content: '';
            position: absolute;
            inset: 12px;
            border-radius: var(--radius);
            border: 1px solid var(--border)
        }

        /* Recording state — inner square filled red */
        /* Video mode selected (idle) — same red as actually recording, so the shutter
           itself hints what tapping it will do, like a phone camera. */
        #mob-shutter.mode-video::before,
        #mob-shutter.recording::before {
            background: #ff2b2b;
            border-color: #ff2b2b
        }

        /* Actively recording — an orange ring around the shutter, gone the moment it stops.
           A real border, not a box-shadow (no drop shadows anywhere in this UI). */
        #mob-shutter.recording {
            border: 3px solid #ff9500;
        }

        /* Flip camera — same row as the shutter, right side (Live mobile) */
        #mob-flip {
            width: 40px;
            height: 40px;
            bottom: 29px;
            right: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0
        }

        /* Gallery — same row as the shutter, left side (Live only) */
        #mob-gallery {
            width: 40px;
            height: 40px;
            bottom: 29px;
            left: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            font-size: 16px;
        }

        #mob-flip img {
            display: block;
            object-fit: contain
        }

        /* Photo/Video mode row — centered, just above the shutter, like a phone camera's
           mode strip. Tap either label or swipe the viewfinder to switch. */
        #mob-capture-mode {
            display: none;
            position: fixed;
            left: 50%;
            bottom: 84px;
            transform: translateX(-50%);
            z-index: 86;
            gap: 10px;
            align-items: center;
        }

        .mob-mode-label {
            border: none;
            border-radius: var(--radius);
            padding: 5px 10px;
            background: transparent;
            cursor: pointer;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
            font-family: 'Outfit', system-ui, sans-serif;
            color: #fff;
            -webkit-text-fill-color: #fff;
            text-shadow: 0 1px 3px rgba(0, 0, 0, .8);
            opacity: .85;
            transition: background .15s, color .15s, opacity .15s;
        }

        /* Upload's backdrop is the plain white canvas, not a camera feed — labels need
           dark text there instead of white-on-shadow, and a real shade behind them
           (instead of relying on a shadow/stroke) so they read against the white canvas. */
        #mob-capture-mode.on-light-bg .mob-mode-label:not(.active) {
            color: var(--muted);
            -webkit-text-fill-color: var(--muted);
            text-shadow: none;
            background: var(--panel);
        }

        #mob-capture-mode.on-light-bg .mob-mode-label.active {
            background: var(--surface);
        }

        @media (hover: hover) {

            #mob-capture-mode.on-light-bg .mob-mode-label:not(.active):hover {
                background: var(--surface);
            }
        }

        .mob-mode-label.active {
            background: var(--fab-bg);
            color: var(--zoom-accent);
            -webkit-text-fill-color: var(--zoom-accent);
            text-shadow: none;
            opacity: 1;
        }

        /* Quick zoom presets — small taps for common levels, above the mode row */
        #mob-zoom-presets {
            display: none;
            position: fixed;
            left: 50%;
            bottom: 120px;
            transform: translateX(-50%);
            z-index: 86;
            gap: 8px;
            align-items: center;
        }

        .mob-zoom-preset {
            border: none;
            border-radius: var(--radius);
            width: 26px;
            height: 26px;
            padding: 0;
            background: transparent;
            cursor: pointer;
            font-size: 10px;
            font-weight: 700;
            font-family: 'Outfit', system-ui, sans-serif;
            color: #fff;
            -webkit-text-fill-color: #fff;
            text-shadow: 0 1px 3px rgba(0, 0, 0, .8);
            opacity: .85;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mob-zoom-preset.active {
            background: var(--fab-bg);
            color: var(--zoom-accent);
            -webkit-text-fill-color: var(--zoom-accent);
            text-shadow: none;
            opacity: 1;
        }

        /* Download — bottom-left (Upload; Live uses preview modal) */
        /* Same row, same size as flip/gallery on every screen (Upload here; Live uses
           the preview modal instead, per downloadPixels()'s caller). */
        #mob-download {
            width: 40px;
            height: 40px;
            bottom: 29px;
            left: auto;
            right: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            /* Must stay above the sliding panel when it's open */
            z-index: 130
        }

        /* Download icon (arrow down) */
        #mob-download::before {
            content: '↓';
            font-size: 20px;
            line-height: 1;
            color: var(--border)
        }

        /* Live zoom dial — hidden until a two-finger pinch on the viewfinder reveals it,
           centered like a phone camera's zoom ruler. No visible trigger button for it. */
        #mob-zoom-pop {
            position: fixed;
            left: 50%;
            bottom: 32px;
            transform: translateX(-50%);
            width: 240px;
            height: 172px;
            padding: 0;
            border: none;
            background: transparent;
            z-index: 141;
        }

        /* While the zoom dial is open, everything else on the viewfinder gets out of the
           way — same as a phone camera hides its other controls while you pinch-zoom. */
        body.zoom-dial-active #mob-shutter,
        body.zoom-dial-active #mob-flip,
        body.zoom-dial-active #mob-capture-mode,
        body.zoom-dial-active #mob-download,
        body.zoom-dial-active #mob-ratio,
        body.zoom-dial-active #mob-zoom-presets,
        body.zoom-dial-active #mob-gallery,
        body.zoom-dial-active #panel-toggle-bar {
            display: none !important;
        }

        /* Curved zoom dial: a ruler bent along an arc, dragged directly (no native
           slider) — deliberately different from the app's square controls elsewhere,
           so it clearly reads as a camera-style zoom wheel. */
        #mob-zoom-dial {
            width: 100%;
            height: 100%;
            touch-action: none;
            cursor: pointer;
            -webkit-user-select: none;
            user-select: none;
        }

        #mob-zoom-dial-label {
            font-family: 'Outfit', system-ui, sans-serif;
            font-size: 20px;
            font-weight: 800;
            fill: var(--zoom-accent);
        }

        /* Side slider — persistent vertical slider on the right edge, both Live and Upload.
           Outside the panel on purpose: dragging it while watching the film look change is
           the app, so it shouldn't need the menu open. What it drives is per preset (the
           label button under it). Short and vertically centered — the menu toggle sits
           above it, same edge. */
        #mob-side-slider-wrap {
            position: fixed;
            top: 50%;
            right: 14px;
            height: 250px;
            transform: translateY(-50%);
            z-index: 86;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        #mob-side-slider-wrap span {
            font-family: 'Outfit', system-ui, sans-serif;
            font-size: 10px;
            font-weight: 700;
            color: var(--text);
            background: var(--fab-bg);
            padding: 3px 4px;
            min-width: 22px;
            text-align: center;
        }

        #side-param {
            border: none;
            border-radius: var(--radius);
            background: var(--fab-bg);
            padding: 4px 5px;
            min-width: 34px;
            font-family: 'Outfit', system-ui, sans-serif;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: .06em;
            color: var(--zoom-accent);
            -webkit-text-fill-color: var(--zoom-accent);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        #side-param:active {
            transform: scale(.94);
        }

        body.mode-upload #mob-side-slider-wrap span,
        body.mode-upload #side-param {
            background: var(--panel);
        }

        body.zoom-dial-active #mob-side-slider-wrap,
        body.panel-open #mob-side-slider-wrap {
            display: none !important;
        }

        #mob-side-slider-wrap input[type=range] {
            flex: 1;
            width: 1px;
            /* Rotated via writing-mode (not -webkit-appearance:slider-vertical, which pulls
               in the OS's own native blue fill/thumb and ignores the square custom thumb
               styling below) so it stays the same flat square design as every other control. */
            writing-mode: vertical-lr;
            direction: rtl;
            -webkit-appearance: none;
            appearance: none;
            background: var(--border);
            outline: none;
            cursor: pointer;
        }

        /* Aspect ratio — top-right, Live only (on mobile below mode header) */
        #mob-ratio {
            width: 44px;
            height: 44px;
            top: 60px;
            right: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        #mob-ratio img {
            width: 22px;
            height: 22px;
            object-fit: contain;
        }

        @media (max-width: 700px) {

            /* Export section still hidden in panel on mobile */
            .section:has(#dl-pixels) {
                display: none
            }
        }

        @media (min-width: 701px) and (max-width: 1024px) {

            /* Tablet — narrower panel */
            #panel {
                width: 220px;
                min-width: 200px
            }
        }

        /* Splash — logo entrance, then the app name typed out, then fades into the
           install-prompt screen right after it. Sits above it (z-index) since it's shown
           first and fades away to reveal it underneath. */
        #splash-screen {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1100;
            background: var(--bg);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Outfit', system-ui, sans-serif;
            opacity: 1;
            transition: opacity .5s ease;
        }

        #splash-screen.show {
            display: flex;
        }

        #splash-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        #splash-logo {
            width: 72px;
            height: 72px;
            opacity: 0;
            transform: scale(.85);
            animation: splash-logo-in .6s cubic-bezier(.2, .9, .3, 1) forwards;
        }

        @keyframes splash-logo-in {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        #splash-title {
            margin-top: 18px;
            min-height: 1em;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--text);
            border-right: 2px solid transparent;
        }

        #splash-title.caret {
            border-right-color: var(--text);
            animation: splash-caret-blink .8s step-end infinite;
        }

        @keyframes splash-caret-blink {

            0%,
            100% {
                border-color: var(--text);
            }

            50% {
                border-color: transparent;
            }
        }

        /* Only appears once typing is done — tapping anywhere on the splash (not just this
           line) is what advances past it; this is just the hint that it's ready to. */
        #splash-hint {
            margin-top: 14px;
            font-size: 9px;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--muted);
            opacity: 0;
            transition: opacity .4s ease;
        }

        #splash-hint.show {
            opacity: 1;
        }

        /* מסך הזמנה להוספה למסך הבית (מובייל, בפתיחה מהקישור) */
        #install-prompt {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            font-family: 'Outfit', system-ui, sans-serif;
        }

        #install-prompt.show {
            display: flex;
        }

        #install-prompt h2 {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        #install-prompt p {
            font-size: 11px;
            color: var(--muted);
            line-height: 1.6;
            margin-bottom: 20px;
            max-width: 280px;
        }

        #install-prompt .install-btn {
            padding: 14px 24px;
            border: none;
            background: var(--text);
            color: var(--bg);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase;
            cursor: pointer;
            font-family: 'Outfit', system-ui, sans-serif;
            margin-bottom: 10px;
        }

        #install-prompt .skip-btn {
            background: transparent;
            color: var(--muted);
            border: none;
            font-size: 10px;
            cursor: pointer;
            text-decoration: underline;
        }

        /* ───── Camera / Film pickers ───── */
        .picker-info {
            font-size: 9px;
            line-height: 1.5;
            color: var(--muted);
        }

        #film-section .sec-label,
        #camera-section .sec-label {
            margin-bottom: 8px;
        }

        @media (max-width: 700px) {
            .picker-info {
                font-size: 11px;
            }
        }

        /* ───── Current-film badge, top-left (opens the film picker) ───── */
        #mob-film-badge {
            display: none;
            position: fixed;
            top: 20px;
            left: 20px;
            height: 40px;
            max-width: calc(100% - 140px);
            padding: 0 12px;
            border: none;
            border-radius: var(--radius);
            background: var(--fab-bg);
            z-index: 86;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-family: 'Outfit', system-ui, sans-serif;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--text);
            -webkit-text-fill-color: var(--text);
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            transition: background .12s, transform .12s;
        }

        #mob-film-badge::before {
            content: '';
            flex: 0 0 auto;
            width: 8px;
            height: 8px;
            background: var(--zoom-accent);
        }

        #mob-film-badge span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #mob-film-badge:active {
            transform: scale(.97);
        }

        body.mode-upload #mob-film-badge {
            background: var(--panel);
        }

        body.panel-open #mob-film-badge,
        body.zoom-dial-active #mob-film-badge,
        body.recording #mob-film-badge {
            display: none !important;
        }

        /* ───── Lens toast ───── */
        #lens-toast {
            position: fixed;
            left: 50%;
            top: 42%;
            transform: translate(-50%, -50%);
            z-index: 120;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 10px 14px;
            background: rgba(0, 0, 0, .45);
            color: #fff;
            -webkit-text-fill-color: #fff;
            font-family: 'Outfit', system-ui, sans-serif;
            text-align: center;
            opacity: 0;
            transition: opacity .25s ease;
        }

        #lens-toast.show {
            opacity: 1;
        }

        #lens-toast b {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: .04em;
        }

        #lens-toast span {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: .1em;
            text-transform: uppercase;
        }

        /* ───── Shutter flash ───── */
        #shutter-flash {
            position: fixed;
            inset: 0;
            background: #fff;
            opacity: 0;
            pointer-events: none;
            z-index: 140;
        }

        #shutter-flash.flash {
            animation: shutter-flash .35s ease-out;
        }

        @keyframes shutter-flash {
            0% {
                opacity: .85;
            }

            100% {
                opacity: 0;
            }
        }

        /* ═════════════════════════════════════════════════════════════════════
           VHS SLEEVE THEME — cream paper, plum ink, sunset stripes. Every control is
           rounded (soft squares / pills) and see-through with a frosted blur. This block
           sits last on purpose: it restyles the shared app shell in one place.
           ═════════════════════════════════════════════════════════════════════ */
        body {
            -webkit-font-smoothing: antialiased;
        }

        /* ── Frosted, translucent floating controls ── */
        #panel-toggle-bar,
        #mob-film-badge,
        #mob-shutter,
        #mob-upload-more,
        #mob-flip,
        #mob-gallery,
        #mob-download,
        #mob-side-slider-wrap,
        .mob-mode-label.active {
            -webkit-backdrop-filter: var(--fab-blur);
            backdrop-filter: var(--fab-blur);
        }

        #panel-toggle-bar,
        #mob-flip,
        #mob-gallery,
        #mob-download,
        #mob-upload-more {
            border-radius: var(--radius);
            color: var(--plum);
            -webkit-text-fill-color: var(--plum);
        }

        #panel-toggle-bar {
            font-size: 18px;
            font-weight: 700;
        }

        #panel-toggle-bar #panel-toggle-icon {
            color: var(--plum);
        }

        #mob-flip img {
            filter: brightness(0) saturate(100%) invert(22%) sepia(10%) saturate(1500%) hue-rotate(275deg) brightness(92%);
        }

        #mob-download::before {
            color: var(--plum);
            font-weight: 600;
        }

        /* Current camera · film — a pill, like the sleeve's "BACK TO THE" label */
        #mob-film-badge {
            border-radius: var(--pill);
            padding: 0 16px 0 12px;
            font-weight: 700;
            letter-spacing: .08em;
            color: var(--plum);
            -webkit-text-fill-color: var(--plum);
        }

        #mob-film-badge::before {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--stripes);
        }

        /* Shutter: a soft square ring with the stripe run inside — the cassette label */
        #mob-shutter {
            width: 64px;
            height: 64px;
            bottom: 18px;
            border-radius: 22px;
        }

        #mob-shutter::before {
            inset: 9px;
            border: none;
            border-radius: 15px;
            background: var(--stripes);
        }

        #mob-shutter.mode-video::before,
        #mob-shutter.recording::before {
            background: #ec5a40;
            border-radius: 50%;
            inset: 14px;
        }

        #mob-shutter.recording {
            border: 3px solid #f6a83c;
        }

        /* Gallery thumbnail keeps the button's rounded shape */
        #mob-gallery.has-thumb img {
            border-radius: var(--radius);
        }

        .gallery-empty-frame {
            border-radius: 5px;
            border-color: var(--plum);
        }

        /* Photo / Video / Upload — pills; active one is solid plum like the sleeve's dark band */
        .mob-mode-label {
            border-radius: var(--pill);
            padding: 6px 13px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .12em;
        }

        .mob-mode-label.active,
        #mob-capture-mode.on-light-bg .mob-mode-label.active {
            background: rgba(74, 57, 66, .78);
            color: var(--cream);
            -webkit-text-fill-color: var(--cream);
        }

        #mob-capture-mode.on-light-bg .mob-mode-label:not(.active) {
            border-radius: var(--pill);
            color: var(--plum);
            -webkit-text-fill-color: var(--plum);
        }

        /* Zoom presets (.5× / 1× / 2×) — small frosted pills; active = plum */
        #mob-zoom-presets {
            gap: 6px;
            bottom: 128px;
        }

        .mob-zoom-preset {
            width: auto;
            min-width: 34px;
            height: 28px;
            padding: 0 8px;
            border-radius: var(--pill);
            font-size: 11px;
            font-weight: 700;
            background: var(--fab-bg);
            -webkit-backdrop-filter: var(--fab-blur);
            backdrop-filter: var(--fab-blur);
            color: var(--plum);
            -webkit-text-fill-color: var(--plum);
            text-shadow: none;
            opacity: 1;
        }

        .mob-zoom-preset.active {
            background: rgba(74, 57, 66, .82);
            color: var(--cream);
            -webkit-text-fill-color: var(--cream);
        }

        /* Pinch zoom dial: cream ticks/labels so it reads over the camera feed */
        #mob-zoom-ticks-g line,
        #mob-zoom-ticks-g path {
            stroke: var(--cream);
        }

        #mob-zoom-ticks-g text {
            fill: var(--cream);
            font-family: 'Outfit', system-ui, sans-serif;
            font-weight: 600;
        }

        #mob-zoom-dial-label {
            font-weight: 800;
        }

        /* Lens slider: a frosted capsule with a plum track and a round knob */
        #mob-side-slider-wrap {
            right: 12px;
            height: 270px;
            padding: 8px 5px;
            border-radius: var(--pill);
            background: var(--fab-bg);
        }

        #mob-side-slider-wrap span,
        body.mode-upload #mob-side-slider-wrap span {
            background: transparent;
            color: var(--plum);
            font-size: 11px;
            font-weight: 800;
            padding: 2px 0 0;
        }

        #mob-side-slider-wrap input[type=range] {
            width: 2px;
            background: rgba(74, 57, 66, .55);
            border-radius: 2px;
        }

        /* Same frosted cream in Upload — it floats over the photo, where a faint plum tint
           left the lens label unreadable. */
        body.mode-upload #mob-side-slider-wrap {
            background: rgba(242, 235, 224, .62);
        }

        #side-param,
        body.mode-upload #side-param {
            border-radius: var(--pill);
            background: var(--plum);
            color: var(--cream);
            -webkit-text-fill-color: var(--cream);
            font-size: 9px;
            font-weight: 700;
            letter-spacing: .1em;
            padding: 5px 7px;
        }

        input[type=range]::-webkit-slider-thumb {
            border-radius: 50% !important;
            background: var(--plum);
            border: 3px solid var(--cream);
            width: 20px;
            height: 20px;
        }

        input[type=range]::-moz-range-thumb {
            border-radius: 50%;
            background: var(--plum);
            border: 3px solid var(--cream);
        }

        /* Recording timer + lens toast — plum pills */
        #mob-rec-timer {
            border-radius: var(--pill);
            background: rgba(74, 57, 66, .82);
            padding: 6px 14px;
            -webkit-backdrop-filter: var(--fab-blur);
            backdrop-filter: var(--fab-blur);
        }

        #mob-rec-timer::before {
            background: #ec5a40;
        }

        #lens-toast {
            border-radius: 22px;
            padding: 14px 22px;
            background: rgba(74, 57, 66, .55);
            -webkit-backdrop-filter: var(--fab-blur);
            backdrop-filter: var(--fab-blur);
        }

        #lens-toast b {
            font-size: 40px;
            font-weight: 800;
            letter-spacing: -.01em;
            line-height: 1;
        }

        #lens-toast span {
            font-weight: 400;
            letter-spacing: .14em;
        }

        /* ── Panel: frosted cream sheet with rounded bottom corners ── */
        @media (max-width: 700px) {
            #panel {
                border-radius: 0 0 26px 26px;
            }

            #panel.panel-open {
                background: rgba(242, 235, 224, .5);
                -webkit-backdrop-filter: blur(16px) saturate(140%);
                backdrop-filter: blur(16px) saturate(140%);
            }

            #panel.panel-open .section {
                background: transparent;
            }

            .section {
                padding: 16px 18px;
            }
        }

        .section {
            border-bottom: 1px solid rgba(74, 57, 66, .14);
        }

        /* "01 CAMERA" — light, spaced caps with a bold number, like "BACK TO THE / 80s" */
        .sec-label {
            font-size: 11px;
            font-weight: 300;
            letter-spacing: .22em;
            color: var(--plum);
        }

        .sec-num {
            font-size: 11px;
            font-weight: 800;
            opacity: 1;
            padding: 2px 7px;
            border-radius: var(--pill);
            background: var(--plum);
            color: var(--cream);
            letter-spacing: .04em;
        }

        #panel.panel-open .sec-num {
            color: var(--cream);
        }

        /* Thin stripe run under each picker heading */
        #camera-section .sec-label::after,
        #film-section .sec-label::after {
            content: '';
            flex: 1;
            height: 6px;
            border-radius: var(--pill);
            background: linear-gradient(90deg, #d7df5a, #f6d34a, #f6a83c, #f27f37, #ec5a40, #d9475a, #a8406c, #74385f);
            opacity: .9;
        }

        .picker-info {
            color: var(--plum);
            font-weight: 400;
        }

        /* Camera / film chips: rounded, see-through; selected = solid plum */
        .film-presets {
            gap: 5px;
            max-height: 92px;
        }

        .pal-tgt {
            border-radius: var(--radius-sm);
            background: rgba(255, 250, 242, .55);
            color: var(--plum);
            -webkit-text-fill-color: var(--plum);
            font-size: 9px;
            font-weight: 600;
            letter-spacing: .06em;
            padding: 8px 3px;
        }

        @media (hover:hover) {
            .pal-tgt:hover {
                background: rgba(255, 250, 242, .85);
                color: var(--plum);
            }
        }

        .pal-tgt.active {
            background: var(--plum);
            color: var(--cream) !important;
            -webkit-text-fill-color: var(--cream) !important;
        }

        .grid-scrollbar {
            width: 6px;
            border-radius: var(--pill);
            background: rgba(74, 57, 66, .12);
        }

        .grid-scrollbar-thumb {
            border-radius: var(--pill);
            background: var(--plum);
        }

        /* ── Buttons ── */
        .btn {
            border-radius: var(--pill);
            font-weight: 700;
            letter-spacing: .14em;
        }

        .btn-fill {
            background: var(--plum);
            color: var(--cream);
        }

        .btn-fill:hover {
            background: var(--plum-deep);
        }

        .btn-outline {
            background: var(--panel);
            color: var(--plum);
        }

        .fm-btn {
            border-radius: var(--pill);
        }

        /* ── Upload drop zone ── */
        #drop-zone {
            border-radius: 26px;
            border: 1.5px dashed rgba(74, 57, 66, .35);
            background: rgba(255, 250, 242, .5);
        }

        .dz-text {
            color: var(--plum);
            font-weight: 400;
        }

        /* ── Gallery ── */
        #gallery-header,
        #gallery-viewer-header {
            border-bottom: 1px solid rgba(74, 57, 66, .14);
        }

        #gallery-title {
            font-size: 16px;
            font-weight: 800;
            letter-spacing: .06em;
        }

        #gallery-grid {
            gap: 4px;
            padding: 4px;
        }

        .gallery-item {
            border-radius: var(--radius-sm);
        }

        .gallery-item .gallery-check {
            border-radius: 50%;
        }

        .gallery-item.selected::after {
            border-radius: var(--radius-sm);
            border-color: var(--plum);
        }

        #gallery-actions,
        #gallery-viewer-actions {
            border-top: 1px solid rgba(74, 57, 66, .14);
        }

        #gallery-select-toggle {
            border-radius: var(--pill);
            padding: 5px 12px;
            background: var(--panel);
            color: var(--plum);
            -webkit-text-fill-color: var(--plum);
        }

        #gallery-select-toggle.active {
            background: var(--plum);
            color: var(--cream);
            -webkit-text-fill-color: var(--cream);
        }

        /* ── Export modal ── */
        .export-modal-card {
            border-radius: 26px;
            overflow: hidden;
            border: none;
            background: rgba(242, 235, 224, .8);
        }

        #export-preview-canvas,
        #export-preview-video {
            border-radius: var(--radius);
            border: none;
        }

        /* ── Splash: the cassette sleeve ── */
        #splash-logo {
            width: 112px;
            height: 112px;
            margin-top: 26px;
        }

        /* Title sits above the logo; min-height keeps the logo from jumping while it types. */
        #splash-title {
            margin-top: 0;
            min-height: 1.05em;
            font-size: 40px;
            font-weight: 800;
            letter-spacing: -.01em;
            text-transform: none;
            line-height: 1.05;
            color: var(--plum);
        }

        #splash-title.caret {
            border-right-color: var(--plum);
        }

        #splash-hint {
            margin-top: 30px;
            font-size: 10px;
            font-weight: 400;
            letter-spacing: .22em;
            color: var(--muted);
        }

        /* ── Install prompt ── */
        #install-prompt h2 {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -.01em;
            text-transform: none;
            color: var(--plum);
        }

        #install-prompt p {
            color: var(--plum);
            font-size: 13px;
        }

        #install-prompt .install-btn {
            border-radius: var(--pill);
            background: var(--plum);
            color: var(--cream);
            padding: 15px 28px;
            letter-spacing: .14em;
        }

        #install-prompt .skip-btn {
            color: var(--muted);
            font-size: 12px;
        }
    </style>
</head>

<body>
    <!-- Splash: plays every launch before anything asks for permission — logo entrance
         animation, then the app name typed out, then waits for a tap. Purely decorative;
         carries no state of its own. -->
    <div id="splash-screen" aria-hidden="true">
        <!-- Hierarchy: name → logo → tap hint. Nothing else. -->
        <h1 id="splash-title"></h1>
        <img id="splash-logo" src="icon.svg?v=3" alt="" />
        <p id="splash-hint">Tap to continue</p>
    </div>
    <!-- Add to home screen prompt (shown on mobile when opening from link) -->
    <div id="install-prompt" aria-hidden="true">
        <h2>Film Camera</h2>
        <p>Add a shortcut to your home screen to open the app from your icon.</p>
        <button type="button" class="install-btn" id="install-prompt-btn">Add to Home Screen</button>
        <p id="install-manual-hint"
            style="display:none; font-size:11px; margin-top:10px; color:var(--text); font-weight:600;"></p>
        <button type="button" class="skip-btn" id="install-prompt-skip">Continue to app</button>
    </div>
    <!-- Recording timer — shown only while actively recording video -->
    <div id="mob-rec-timer" aria-hidden="true">00:00</div>
    <!-- Lens name + character, shown briefly while the lens slider moves -->
    <div id="lens-toast" aria-live="polite"></div>
    <!-- White flash over the viewfinder when a photo is taken -->
    <div id="shutter-flash" aria-hidden="true"></div>
    <!-- Menu toggle -->
    <div id="panel-toggle-bar" aria-label="Toggle controls">
        <span id="panel-toggle-icon" aria-hidden="true">☰</span>
    </div>
    <!-- Current film, top-left — tapping it opens the film picker (the panel) -->
    <button id="mob-film-badge" type="button" aria-label="Choose film" style="display:none"><span
            id="mob-film-badge-label">Portra 400</span></button>

    <!-- Mobile camera controls -->
    <!-- Shutter: big square at bottom center -->
    <button id="mob-shutter" aria-label="Capture"></button>
    <!-- Upload mode's equivalent of the shutter: always available (even once an image is
         already loaded) so there's a way to pick another one and replace it. -->
    <button id="mob-upload-more" aria-label="Upload image" type="button" style="display:none">↑</button>
    <!-- Lens: a persistent vertical slider on the right edge, shown in both Live and Upload.
         Snaps between LENSES (fisheye at the bottom → 135mm tele on top); each camera starts
         on the lens it shipped with. Tapping the LENS label steps to the next one. -->
    <div id="mob-side-slider-wrap" style="display:none">
