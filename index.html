        <span id="side-val">50mm</span>
        <input type="range" id="side-slider" min="0" max="6" value="4" step="1" aria-label="Lens" />
        <button type="button" id="side-param" aria-label="Next lens">LENS</button>
    </div>
    <!-- Aspect ratio: top, Live only -->
    <button id="mob-ratio" aria-label="Aspect ratio" type="button" style="display:none">
        <img src="ratio_icon.png" alt="" width="22" height="22">
    </button>
    <!-- Camera flip -->

    <script>
        // Surface runtime errors (helps when something stops all buttons)
        (function () {
            let shown = false;
            function show(msg) {
                if (shown) return;
                shown = true;
                try { alert(msg); } catch (_) { }
            }
            window.addEventListener('error', function (e) {
                const m = (e && e.message) ? e.message : 'Unknown error';
                show('App error: ' + m);
            });
            window.addEventListener('unhandledrejection', function (e) {
                const r = e && e.reason;
                const m = r ? (r.message || String(r)) : 'Unhandled promise rejection';
                show('App error: ' + m);
            });
        })();

        // ═══════════════════════════════════════════════════
        //  STATE
        // ═══════════════════════════════════════════════════
        const state = {
            mode: 'live',
            // Upload: the decoded photo, redrawn onto a canvas (long side capped to what the
            // GPU can take as one texture) — the source every Upload render reads from.
            srcImage: null,
            uploadSeed: 0,      // fixed grain/leak seed per uploaded photo, so tweaking a slider doesn't re-roll the grain
            uploadRect: null,   // where the Upload preview sits inside #main, CSS px
            bg: '#f2ebe0',
            captureMode: 'image',
            exportRatio: null,
        };

        // ═══════════════════════════════════════════════════
        //  VIEW CANVAS
        // ═══════════════════════════════════════════════════
        const gridCanvas = document.getElementById('grid-canvas');
        const gctx = gridCanvas.getContext('2d');

        // 3 breakpoints: mobile / tablet / desktop
        const BP_MOBILE = 700;
        const BP_TABLET = 1024;
        function getLayoutMode() {
            const w = window.innerWidth || 0;
            if (w <= BP_MOBILE) return 'mobile';
            if (w <= BP_TABLET) return 'tablet';
            return 'desktop';
        }
        function isMobileLayout() { return getLayoutMode() === 'mobile'; }
        function isTabletLayout() { return getLayoutMode() === 'tablet'; }
        function isDesktopLayout() { return getLayoutMode() === 'desktop'; }

        function hexToRgba(hex, a) { const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16); return `rgba(${r},${g},${b},${a})`; }

        // ═══════════════════════════════════════════════════
        //  CAMERAS · FILMS · LENSES
        // ═══════════════════════════════════════════════════
        // The whole look is fixed — there are no user sliders. You pick a camera and a film,
        // and the side slider picks a lens. A film supplies the chemistry (color, contrast,
        // grain, halation); a camera supplies the optics and print (vignette, soft plastic
        // lens, light leaks, fringing, instant-film frame, date stamp) plus small color
        // nudges; a lens supplies field of view and wide-angle distortion. combineLook()
        // merges the three into the one settings object film.render() takes.

        // Every parameter the shader understands, on plain slider-like scales (the mapping
        // to shader values lives in film.render()'s uniforms). Not user-facing.
        const LOOK_PARAMS = {
            intensity: 100, exposure: 0, contrast: 0, saturation: 0, warmth: 0, tint: 0, fade: 0,
            grain: 0, vignette: 0, halation: 0, leak: 0, blur: 0, chroma: 0,
        };
        // A camera's color nudges are added on top of the film's; these stay in range.
        const PARAM_RANGE = { exposure: [-100, 100], contrast: [-100, 100], saturation: [-100, 100], warmth: [-100, 100], tint: [-100, 100] };

        // Film chemistry that isn't one of LOOK_PARAMS: per-channel tone curve (gamma — <1
        // lifts that channel, >1 sinks it), split-tone tints added to shadows/highlights, B&W
        // conversion weights, halation color, grain size, and (instant films) the print frame.
        const FILM_LOOK_DEFAULTS = {
            gamma: [1, 1, 1], shadows: [0, 0, 0], highlights: [0, 0, 0],
            mono: 0, mix: [0.299, 0.587, 0.114], halColor: [1, 0.32, 0.12],
            grainSize: 1.2, frame: 'none',
        };

        function hashKey(key) {
            let h = 0;
            for (let i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) % 997;
            return h / 37;
        }

        // ── Films ──
        const FILMS = {};
        const FILM_ORDER = [];
        function FILM(key, label, name, desc, adj, look) {
            FILMS[key] = { key, label, name, desc, adj: adj || {}, look: Object.assign({}, FILM_LOOK_DEFAULTS, look || {}) };
            FILM_ORDER.push(key);
        }

        // Color negative
        FILM('portra160', 'Portra 160', 'Kodak Portra 160', 'Fine grain, low contrast, natural warm skin.',
            { contrast: -15, saturation: -10, warmth: 12, fade: 12, grain: 12 },
            { gamma: [0.97, 1.0, 1.04], shadows: [0.01, 0.0, 0.02], highlights: [0.03, 0.015, -0.01], grainSize: 1 });
        FILM('portra400', 'Portra 400', 'Kodak Portra 400', 'Warm, soft skin tones and gentle pastels.',
            { exposure: 8, contrast: -10, saturation: -5, warmth: 15, fade: 15, grain: 22 },
            { gamma: [0.96, 0.99, 1.05], shadows: [0.0, 0.01, 0.025], highlights: [0.035, 0.02, -0.01] });
        FILM('portra800', 'Portra 800', 'Kodak Portra 800', 'Warmer, grainier Portra for low light.',
            { contrast: -5, saturation: 5, warmth: 22, fade: 12, grain: 38, halation: 8 },
            { gamma: [0.95, 0.99, 1.06], highlights: [0.04, 0.02, -0.01], grainSize: 1.4 });
        FILM('ektar100', 'Ektar 100', 'Kodak Ektar 100', 'The most vivid negative: punchy reds, deep blues.',
            { contrast: 25, saturation: 40, warmth: 5, grain: 8 },
            { gamma: [0.94, 1.0, 0.98], shadows: [0.0, 0.0, 0.02], highlights: [0.02, 0.0, -0.02], grainSize: 1 });
        FILM('gold200', 'Gold 200', 'Kodak Gold 200', 'Golden-hour yellows and nostalgic warmth.',
            { contrast: 8, saturation: 18, warmth: 35, fade: 8, grain: 25 },
            { gamma: [0.93, 0.97, 1.12], highlights: [0.05, 0.03, -0.03] });
        FILM('ultramax', 'UltraMax', 'Kodak UltraMax 400', 'Saturated, warm, friendly visible grain.',
            { contrast: 12, saturation: 25, warmth: 25, grain: 35 },
            { gamma: [0.95, 0.98, 1.08], grainSize: 1.3 });
        FILM('colorplus', 'ColorPlus', 'Kodak ColorPlus 200', 'Budget Kodak: warm, muted greens, milky shadows.',
            { saturation: 5, warmth: 28, fade: 18, grain: 30 },
            { gamma: [0.95, 0.96, 1.1], shadows: [0.02, 0.0, 0.03] });
        FILM('superia', 'Superia', 'Fujifilm Superia 400', 'Cool, green-leaning, magenta kick in the shadows.',
            { contrast: 10, saturation: 10, warmth: -12, tint: -10, grain: 28 },
            { gamma: [1.04, 0.97, 1.0], shadows: [-0.01, 0.02, 0.03], highlights: [0.0, 0.01, 0.02] });
        FILM('c200', 'Fuji C200', 'Fujicolor C200', 'Soft contrast, cool greens and teal skies.',
            { contrast: -5, warmth: -8, tint: -15, fade: 10, grain: 26 },
            { gamma: [1.03, 0.96, 0.99], highlights: [0.02, 0.03, 0.0] });
        FILM('pro400h', 'Pro 400H', 'Fujifilm Pro 400H', 'Airy pastels with mint-cyan shadows.',
            { exposure: 20, contrast: -20, saturation: -15, warmth: -5, tint: -8, fade: 18, grain: 18 },
            { gamma: [1.02, 0.97, 0.96], shadows: [-0.01, 0.02, 0.03], highlights: [0.0, 0.02, 0.02] });
        FILM('agfavista', 'Agfa Vista', 'Agfa Vista 200', 'Bold reds, warm light, crisp and poppy.',
            { contrast: 15, saturation: 35, warmth: 15, tint: 5, grain: 25 },
            { gamma: [0.9, 1.0, 1.03] });
        FILM('lomo800', 'Lomo 800', 'Lomography Color 800', 'Wild saturation and heavy grain, made for neon.',
            { contrast: 25, saturation: 45, warmth: 10, grain: 55, halation: 10 },
            { gamma: [0.95, 0.98, 1.02], grainSize: 1.5 });
        // Slide
        FILM('kodachrome', 'Kodachrome', 'Kodak Kodachrome 64', 'Rich reds, deep shadows, warm documentary color.',
            { exposure: -8, contrast: 30, saturation: 25, warmth: 12, grain: 10 },
            { gamma: [0.9, 1.02, 1.06], shadows: [0.0, 0.0, 0.015], highlights: [0.03, 0.01, -0.02], grainSize: 1 });
        FILM('velvia50', 'Velvia 50', 'Fujifilm Velvia 50', 'Extreme saturation: electric greens and skies.',
            { exposure: -10, contrast: 38, saturation: 60, tint: -5, grain: 6 },
            { gamma: [1.0, 0.95, 0.94], shadows: [0.0, 0.0, 0.02], grainSize: 1 });
        FILM('provia', 'Provia', 'Fujifilm Provia 100F', 'Clean, faithful, saturated but natural.',
            { contrast: 20, saturation: 25, warmth: -3, grain: 8 },
            { grainSize: 1 });
        FILM('ektachrome', 'Ektachrome', 'Kodak Ektachrome E100', 'Cool, clean and contrasty, true blues.',
            { contrast: 22, saturation: 18, warmth: -15, grain: 10 },
            { gamma: [1.02, 1.0, 0.94], shadows: [-0.01, 0.0, 0.02], grainSize: 1 });
        FILM('ctprecisa', 'CT Precisa', 'Agfa CT Precisa 100', 'Cool cyan-blue cast, punchy color.',
            { contrast: 18, saturation: 25, warmth: -22, grain: 12 },
            { gamma: [1.06, 0.98, 0.92], shadows: [0.0, 0.01, 0.04] });
        FILM('xpro', 'Cross Pro', 'Cross-processed slide', 'Yellow-green highs, cyan shadows, huge contrast.',
            { contrast: 45, saturation: 35, grain: 25 },
            { gamma: [0.9, 0.85, 1.35], shadows: [-0.02, 0.02, 0.06], highlights: [0.05, 0.06, -0.08] });
        // Cinema
        FILM('cinestill800t', 'CineStill 800T', 'CineStill 800T', 'Tungsten movie film: cool nights, red halos.',
            { contrast: 5, saturation: 5, warmth: -45, tint: 5, fade: 8, grain: 30, halation: 70 },
            { gamma: [1.04, 1.0, 0.94], shadows: [-0.01, 0.01, 0.04], halColor: [1, 0.18, 0.08], grainSize: 1.3 });
        FILM('cinestill50d', 'CineStill 50D', 'CineStill 50D', 'Daylight cinema: clean, fine, soft glow.',
            { contrast: 8, saturation: 12, warmth: 5, grain: 8, halation: 35 },
            { grainSize: 1 });
        FILM('vision500t', 'Vision3', 'Kodak Vision3 500T', 'Teal shadows, warm skin, gentle roll-off.',
            { contrast: -12, saturation: -8, warmth: -10, fade: 10, grain: 28, halation: 15 },
            { shadows: [-0.02, 0.02, 0.04], highlights: [0.04, 0.02, -0.02] });
        FILM('eterna', 'Eterna', 'Fujifilm Eterna 500', 'Flat, muted, moody with soft green shadows.',
            { contrast: -20, saturation: -25, warmth: -5, fade: 12, grain: 15 },
            { shadows: [-0.01, 0.015, 0.02] });
        FILM('bleach', 'Bleach Byp', 'Bleach bypass', 'Desaturated, gritty, high-contrast silver look.',
            { exposure: -5, contrast: 45, saturation: -60, grain: 25 });
        // Black & white
        FILM('trix', 'Tri-X 400', 'Kodak Tri-X 400', 'Punchy blacks, bright mids, gritty grain.',
            { contrast: 30, grain: 45 },
            { mono: 1, mix: [0.3, 0.6, 0.1], grainSize: 1.3 });
        FILM('hp5', 'HP5 Plus', 'Ilford HP5 Plus 400', 'Softer, greyer, lifted shadows, visible grain.',
            { contrast: 5, fade: 10, grain: 40 },
            { mono: 1, grainSize: 1.3 });
        FILM('tmax100', 'T-Max 100', 'Kodak T-Max 100', 'Smooth tones, almost invisible grain.',
            { contrast: 15, grain: 10 },
            { mono: 1, mix: [0.27, 0.62, 0.11], grainSize: 1 });
        FILM('delta3200', 'Delta 3200', 'Ilford Delta 3200', 'Salt-and-pepper grain everywhere.',
            { contrast: 25, fade: 6, grain: 85 },
            { mono: 1, grainSize: 1.8 });
        FILM('panf', 'Pan F 50', 'Ilford Pan F Plus 50', 'Razor sharp, contrasty, inky blacks.',
            { contrast: 45, grain: 5 },
            { mono: 1, mix: [0.35, 0.55, 0.1], grainSize: 1 });
        FILM('fomapan', 'Fomapan', 'Fomapan 100 Classic', 'Old-school emulsion, a little soft and dark.',
            { contrast: 20, fade: 8, grain: 35 },
            { mono: 1 });
        FILM('sepia', 'Sepia', 'Sepia-toned print', 'Warm brown toning of an old darkroom print.',
            { contrast: -5, fade: 15, grain: 25 },
            { mono: 1, shadows: [0.03, 0.0, -0.03], highlights: [0.06, 0.03, -0.04] });
        // Instant (these come with their print frame)
        FILM('polaroidcolor', 'Polaroid', 'Polaroid Color film', 'Soft, faded, warm, greenish shadows. White frame.',
            { exposure: 5, contrast: -18, saturation: -15, warmth: 18, tint: -6, fade: 25, grain: 20 },
            { gamma: [0.95, 0.93, 1.1], shadows: [0.0, 0.02, 0.04], highlights: [0.04, 0.04, -0.03], frame: 'polaroid' });
        FILM('polaroidbw', 'Polaroid BW', 'Polaroid B&W film', 'Silvery, soft, slightly faded mono instant.',
            { contrast: 10, fade: 18, grain: 22 },
            { mono: 1, shadows: [0.0, 0.005, 0.015], highlights: [0.01, 0.01, 0.0], frame: 'polaroid' });
        FILM('instax', 'Instax', 'Fujifilm Instax Mini film', 'Bright, cool, high-key instant print.',
            { exposure: 15, contrast: 5, saturation: 10, warmth: -10, fade: 8, grain: 10 },
            { frame: 'instax' });

        // ── Cameras ──
        // adj: color nudges (added to the film's) + optics (vignette/blur/leak/chroma/halation,
        // added too) · frame/date: print features. Cameras never set the lens.
        const CAMERAS = {};
        const CAMERA_ORDER = [];
        function CAMERA(key, label, name, desc, adj, extra) {
            CAMERAS[key] = Object.assign({ key, label, name, desc, adj: adj || {}, frame: null, date: false, leakColor: [1, 0.42, 0.12], grainMul: 1 }, extra || {});
            CAMERA_ORDER.push(key);
        }
        CAMERA('ae1', 'Canon AE-1', 'Canon AE-1', 'The best-selling 70s SLR. Clean, honest optics.',
            { vignette: 12 });
        CAMERA('fm2', 'Nikon FM2', 'Nikon FM2', 'All-mechanical 80s SLR, crisp Nikkor glass.',
            { contrast: 4, vignette: 10 });
        CAMERA('k1000', 'Pentax K1000', 'Pentax K1000', 'The student classic. Simple and a little warm.',
            { warmth: 4, vignette: 14 });
        CAMERA('om1', 'Olympus OM-1', 'Olympus OM-1', 'Compact 70s SLR with soft Zuiko rendering.',
            { contrast: -4, vignette: 12, blur: 4 });
        CAMERA('leicam3', 'Leica M3', 'Leica M3', 'Rangefinder legend: deep contrast, gentle falloff.',
            { contrast: 6, vignette: 18 });
        CAMERA('contaxt2', 'Contax T2', 'Contax T2', 'Luxury compact, razor-sharp Zeiss 38mm.',
            { contrast: 6, saturation: 4, vignette: 12 });
        CAMERA('mju', 'Mju II', 'Olympus Mju II', '90s point-and-shoot with the orange date stamp.',
            { contrast: 6, saturation: 6, vignette: 20 }, { date: true });
        CAMERA('t4', 'Yashica T4', 'Yashica T4', 'Cult compact: punchy, sharp, date stamp.',
            { contrast: 8, saturation: 6, vignette: 16 }, { date: true });
        CAMERA('disposable', 'Disposable', 'Kodak FunSaver', 'Single-use party camera: flash look, soft corners, date.',
            { exposure: 5, contrast: 6, saturation: 6, vignette: 30, blur: 15, chroma: 15 }, { date: true, grainMul: 1.15 });
        CAMERA('lca', 'Lomo LC-A', 'Lomo LC-A', 'Heavy vignette, saturated, contrasty — the Lomography original.',
            { contrast: 10, saturation: 15, vignette: 70 });
        CAMERA('holga', 'Holga 120', 'Holga 120N', 'Plastic toy lens: soft edges, dark corners, light leaks.',
            { contrast: 6, vignette: 75, leak: 45, blur: 55, chroma: 20 }, { leakColor: [1, 0.3, 0.05], grainMul: 1.15 });
        CAMERA('diana', 'Diana F+', 'Diana F+', 'Dreamy 60s toy camera: hazy, glowing, leaky.',
            { contrast: -10, saturation: -8, warmth: 6, fade: 10, vignette: 55, halation: 18, leak: 25, blur: 45 });
        CAMERA('instamatic', 'Instamatic', 'Kodak Instamatic', '70s snapshots: faded, warm-magenta, soft corners.',
            { contrast: -5, saturation: -8, warmth: 10, tint: 10, fade: 12, vignette: 40, blur: 15 });
        CAMERA('penf', 'Olympus Pen', 'Olympus Pen F (half-frame)', 'Half-frame: twice the shots, a little more grain.',
            { vignette: 15 }, { grainMul: 1.35 });
        CAMERA('sx70', 'SX-70', 'Polaroid SX-70', 'Folding 1972 instant SLR. Soft, dreamy, framed.',
            { vignette: 25, blur: 15 }, { frame: 'polaroid' });
        CAMERA('onestep', 'OneStep', 'Polaroid OneStep 600', 'Point-and-shoot instant with a bright flash look.',
            { exposure: 6, vignette: 18, blur: 8 }, { frame: 'polaroid' });
        CAMERA('instaxmini', 'Instax Mini', 'Fujifilm Instax Mini', 'Credit-card-size instant prints.',
            { vignette: 10 }, { frame: 'instax' });
        CAMERA('rollei', 'Rolleiflex', 'Rolleiflex 2.8F', 'Twin-lens medium format: smooth, gentle falloff.',
            { contrast: -4, vignette: 15, blur: 5 }, { grainMul: 0.7 });
        CAMERA('hasselblad', 'Hasselblad', 'Hasselblad 500C/M', 'Medium format: huge, clean negatives.',
            { vignette: 8 }, { grainMul: 0.6 });
        CAMERA('super8', 'Super 8', 'Canon 514XL Super 8', 'Home movies: warm, soft, grainy, flickering leak.',
            { contrast: 6, warmth: 10, fade: 8, vignette: 50, leak: 15, blur: 25, chroma: 10 }, { grainMul: 1.6 });

        // ── Lenses (the side slider) ──
        // A lens never crops or zooms — the whole frame always stays in view. It changes how
        // space *feels*: wide lenses bulge the scene toward you (barrel distortion, heavier
        // corners); long lenses fall off into soft, glowing out-of-focus surroundings around a
        // sharp center (shallow depth of field). No pincushion for long lenses: keeping the
        // full frame with pincushion would need pixels from outside the frame (smeared
        // edges). distort: barrel strength (≥0) · circle: round fisheye image ·
        // dof: depth-of-field falloff strength · vignette: added to the camera's.
        const LENSES = [
            { key: 'fish', label: '8mm', name: 'Fisheye', feel: 'Round 180° world', distort: 1.4, circle: 1, dof: 0, vignette: 10 },
            { key: '24', label: '24mm', name: 'Ultra wide', feel: 'Space bulges toward you', distort: 0.28, circle: 0, dof: 0, vignette: 18 },
            { key: '28', label: '28mm', name: 'Wide', feel: 'Open, deep, everything sharp', distort: 0.12, circle: 0, dof: 0, vignette: 10 },
            { key: '35', label: '35mm', name: 'Street', feel: 'Natural with a little depth', distort: 0.06, circle: 0, dof: 0.1, vignette: 5 },
            { key: '50', label: '50mm', name: 'Normal', feel: 'How the eye sees', distort: 0, circle: 0, dof: 0.28, vignette: 3 },
            { key: '85', label: '85mm', name: 'Portrait', feel: 'Sharp subject, soft background', distort: 0, circle: 0, dof: 0.65, vignette: 2 },
            { key: '135', label: '135mm', name: 'Tele', feel: 'Isolated subject, creamy blur', distort: 0, circle: 0, dof: 1, vignette: 2 },
        ];
        function lensIndex(key) { return Math.max(0, LENSES.findIndex((l) => l.key === key)); }

        const DEFAULT_CAMERA_KEY = 'ae1';
        const DEFAULT_FILM_KEY = 'portra400';
        let ACTIVE_CAMERA_KEY = DEFAULT_CAMERA_KEY;
        let ACTIVE_FILM_KEY = DEFAULT_FILM_KEY;
        // 50mm = "normal", closest to no lens character. Only the lens slider changes
        // this — never the camera picker.
        const DEFAULT_LENS_KEY = '50';
        let ACTIVE_LENS_KEY = DEFAULT_LENS_KEY;
        let __filmSettingsCache = null;

        function combineLook(cameraKey, filmKey, lensKey) {
            const cam = CAMERAS[cameraKey] || CAMERAS[DEFAULT_CAMERA_KEY];
            const f = FILMS[filmKey] || FILMS[DEFAULT_FILM_KEY];
            const lens = LENSES[lensIndex(lensKey)];
            const adj = {};
            Object.keys(LOOK_PARAMS).forEach((k) => {
                let v = (f.adj[k] != null ? f.adj[k] : LOOK_PARAMS[k]) + (cam.adj[k] || 0);
                if (k === 'vignette') v += lens.vignette;
                const r = PARAM_RANGE[k] || [0, 100];
                adj[k] = Math.max(r[0], Math.min(r[1], v));

            const look = Object.assign({}, f.look, {
                leakColor: cam.leakColor,

                key: cam.key + '_' + f.key, camera: cam, film: f, lens,

        // Read every frame by the Live loop, so cached — anything that changes the camera,
        // film or lens must null __filmSettingsCache (the setters below do).
        function activeFilmSettings() {

        // ═══════════════════════════════════════════════════
        //  FILM ENGINE (WebGL)
        // ═══════════════════════════════════════════════════
        // One full-screen-quad fragment shader does the whole look per pixel: chromatic
        // fringing → edge (toy-lens) blur → halation → exposure → B&W mix → saturation →
        // white balance → contrast → per-channel curve → split tone → fade → light leak →
        // vignette → grain → intensity mix with the untouched source. The source (camera
        // <video>, rotated canvas, or uploaded photo) is uploaded as a texture each render;
        // the crop/zoom/mirror is a UV transform (uSrcOff + uv * uSrcScale), not a 2D draw.
        const FILM_VERT = `
attribute vec2 aPos;
varying vec2 vUv;
void main() {
    vUv = vec2((aPos.x + 1.0) * 0.5, (1.0 - aPos.y) * 0.5);
    gl_Position = vec4(aPos, 0.0, 1.0);
}`;
        const FILM_FRAG = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
varying vec2 vUv;
uniform sampler2D uTex;
uniform vec2 uSrcOff, uSrcScale, uOutSize;
uniform float uIntensity, uExposure, uContrast, uSaturation, uWarmth, uTint, uFade;
uniform float uGrain, uGrainScale, uVignette, uHalation, uLeak, uBlur, uChroma, uMono;
uniform float uTime, uSeed, uDistort, uCircle, uDof;
uniform vec3 uMix, uGamma, uShadows, uHighlights, uHalColor, uLeakColor;
const vec3 LUMA = vec3(0.2126, 0.7152, 0.0722);

vec3 src(vec2 uv) { return texture2D(uTex, uSrcOff + clamp(uv, 0.0, 1.0) * uSrcScale).rgb; }

// Lens: barrel distortion (output → source radius r*(1+k r^2)/(1+k), so the center bulges
// and the edges compress); a fisheye also squeezes the whole frame into a circle.
vec2 lensUV(vec2 uv, float ar) {
    if (abs(uDistort) < 0.001) return uv;
    vec2 p = (uv - 0.5) * vec2(ar, 1.0);
    float halfDiag = length(vec2(ar, 1.0)) * 0.5;
    float R = (uCircle > 0.5) ? min(ar, 1.0) * 0.5 : halfDiag;
    float r = length(p) / R;
    float sr = r * (1.0 + uDistort * r * r) / (1.0 + uDistort);
    // A round fisheye only reaches out to its own circle, so the whole image stays inside
    // the source frame (reaching to the corners would smear clamped edge pixels on a tall
    // frame); a plain barrel lens keeps the full frame, corner to corner.
    vec2 q = (r > 0.0001) ? normalize(p) * sr * R : vec2(0.0);
    return 0.5 + q / vec2(ar, 1.0);
}
float hash(vec2 p) { p = mod(p, 1024.0); return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }

void main() {
    float ar = uOutSize.x / uOutSize.y;
    vec2 uv = lensUV(vUv, ar);
    vec2 cen = vUv - 0.5;
    float r2 = dot(cen, cen) * 2.0;
    vec3 orig = src(uv);
    vec3 col = orig;

    if (uChroma > 0.001) {
        vec2 ca = cen * uChroma * 0.014;
        col.r = src(uv + ca).r;
        col.b = src(uv - ca).b;
    }
    if (uBlur > 0.001) {
        float rad = uBlur * (0.15 + r2) * 0.012;
        vec3 acc = col;
        for (int i = 0; i < 8; i++) {
            float a = float(i) * 0.785398;
            acc += src(uv + vec2(cos(a), sin(a) * ar) * rad);
        }
        col = acc / 9.0;
    }
    if (uDof > 0.001) {
        // Long-lens depth of field: sharp center, surroundings melt into a disk blur whose
        // highlights are weighted up so they bloom like bokeh.
        float rad = uDof * smoothstep(0.06, 0.55, r2) * 0.02;
        if (rad > 0.0002) {
            vec3 acc = col;
            float wsum = 1.0;
            for (int i = 0; i < 12; i++) {
                float a = float(i) * 0.523599 + 0.26;
                float rr = (mod(float(i), 2.0) < 0.5) ? 1.0 : 0.55;
                vec3 sm = src(uv + vec2(cos(a), sin(a) * ar) * rad * rr);
                float bw = 1.0 + 2.5 * max(0.0, dot(sm, LUMA) - 0.7);
                acc += sm * bw;
                wsum += bw;
            }
            col = acc / wsum;
        }
    }
    if (uHalation > 0.001) {
        float glow = 0.0;
        for (int i = 0; i < 12; i++) {
            float a = float(i) * 0.523599;
            float rr = (mod(float(i), 2.0) < 0.5) ? 0.022 : 0.011;
            vec3 s = src(uv + vec2(cos(a), sin(a) * ar) * rr);
            glow += max(0.0, dot(s, LUMA) - 0.6);
        }
        glow = glow / 12.0 / 0.4;
        col += uHalColor * glow * uHalation * 1.6;
    }

    col *= uExposure;
    if (uMono > 0.5) col = vec3(dot(col, uMix));
    float l = dot(col, LUMA);
    col = mix(vec3(l), col, uSaturation);
    col.r *= 1.0 + uWarmth * 0.14;
    col.g *= 1.0 + uWarmth * 0.03 - uTint * 0.09;
    col.b *= 1.0 - uWarmth * 0.16;
    col = clamp(col, 0.0, 1.0);
    col = clamp((col - 0.5) * uContrast + 0.5, 0.0, 1.0);
    col = pow(max(col, vec3(0.0001)), uGamma);
    l = dot(col, LUMA);
    col += uShadows * (1.0 - l) * (1.0 - l) + uHighlights * l * l;
    col = col * (1.0 - uFade * 1.3) + uFade;

    if (uLeak > 0.001) {
        float t = uSeed + uTime * 0.05;
        vec2 p1 = vec2(-0.05 + 0.08 * sin(t * 1.3), 0.25 + 0.35 * (0.5 + 0.5 * sin(t * 0.7)));
        vec2 d1 = (uv - p1) * vec2(ar, 1.0);
        float l1 = exp(-dot(d1, d1) * 7.0);
        vec2 p2 = vec2(1.02, 0.8 + 0.15 * cos(t * 0.9));
        vec2 d2 = (uv - p2) * vec2(ar, 1.0);
        float l2 = exp(-dot(d2, d2) * 14.0);
        vec3 lc = uLeakColor * l1 + vec3(1.0, 0.78, 0.35) * l2 * 0.8;
        col = 1.0 - (1.0 - col) * (1.0 - clamp(lc * uLeak * 1.3, 0.0, 1.0));
    }
    if (uVignette > 0.001) {
        float d = length(cen) * 1.4142;
        col *= 1.0 - uVignette * smoothstep(0.3, 1.05, d) * 0.95;
    }
    if (uGrain > 0.001) {
        vec2 gp = floor(gl_FragCoord.xy / uGrainScale);
        vec2 go = vec2(fract(uTime * 0.618034) * 911.0, fract(uTime * 0.414214) * 577.0);
        float n = hash(gp + go) + hash(gp + go + 37.17) - 1.0;
        float gL = dot(col, LUMA);
        col += n * uGrain * 0.2 * (0.55 + 0.45 * (1.0 - abs(gL - 0.5) * 2.0));
    }
    col = mix(orig, clamp(col, 0.0, 1.0), uIntensity);
    if (uCircle > 0.5) {
        vec2 pc = cen * vec2(ar, 1.0);
        float rc = length(pc) / (min(ar, 1.0) * 0.5);
        col *= 1.0 - smoothstep(0.97, 1.0, rc);
    }
    gl_FragColor = vec4(col, 1.0);
}`;

        // Cover-crop of a source (sw×sh) into an output aspect, as a sub-rectangle of the
        // source in 0..1 UV space; zoom (>=1) crops further into the center.
        function coverCrop(sw, sh, outW, outH, zoom) {
            const srcAR = sw / sh, outAR = outW / outH;
            let w = 1, h = 1;
            if (srcAR > outAR) w = outAR / srcAR; else h = srcAR / outAR;
            const z = Math.max(1, Math.min(8, zoom || 1));
            w /= z; h /= z;
            return { x: (1 - w) / 2, y: (1 - h) / 2, w, h };

        const FULL_CROP = { x: 0, y: 0, w: 1, h: 1 };

        // No WebGL (very old browser, or the GPU is blocklisted): a rough Canvas2D
        // approximation with ctx.filter, so the app still works instead of going blank.
        function makeFallbackFilm(canvas) {
            const ctx = canvas.getContext('2d');

                canvas, ok: false, maxTex: 4096,
                render(source, o) {

                    if (canvas.height !== o.outH) canvas.height = o.outH;
                    const sw = source.videoWidth || source.width, sh = source.videoHeight || source.height;
                    const c = o.crop || FULL_CROP, a = o.settings.adj;
                    ctx.save();
                    ctx.filter = 'brightness(' + Math.pow(2, a.exposure / 100) + ') contrast(' + (1 + a.contrast / 100 * 0.7) + ') saturate(' +
                        (o.settings.look.mono ? 0 : Math.max(0, 1 + a.saturation / 100)) + ') sepia(' + Math.min(1, Math.max(0, a.warmth) / 250 + a.fade / 300) + ')';
                    if (o.mirror) { ctx.translate(o.outW, 0); ctx.scale(-1, 1); }
                    ctx.drawImage(source, c.x * sw, c.y * sh, c.w * sw, c.h * sh, 0, 0, o.outW, o.outH);
                    ctx.restore();

                }

        }

        const film = (function () {
            const canvas = document.createElement('canvas');
            canvas.width = 2; canvas.height = 2;
            // preserveDrawingBuffer: the result is read back with drawImage()/toBlob() after
            // the frame is composited (preview blit, shutter copy, video recorder blit).
            const attrs = { preserveDrawingBuffer: true, antialias: false, alpha: false, premultipliedAlpha: false };
            let gl = null;
            try { gl = canvas.getContext('webgl', attrs) || canvas.getContext('experimental-webgl', attrs); } catch (_) { gl = null; }
            if (!gl) return makeFallbackFilm(canvas);

            function compile(type, text) {
                const sh = gl.createShader(type);
                gl.shaderSource(sh, text);
                gl.compileShader(sh);
                if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh) || 'shader compile failed');
                return sh;
            }
            let prog;
            try {
                prog = gl.createProgram();
                gl.attachShader(prog, compile(gl.VERTEX_SHADER, FILM_VERT));
                gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FILM_FRAG));
                gl.linkProgram(prog);
                if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog) || 'link failed');
            } catch (e) {
                try { console.warn('Film shader failed, using 2D fallback:', e); } catch (_) { }
                return makeFallbackFilm(document.createElement('canvas'));
            }
            gl.useProgram(prog);

            const buf = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, buf);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
            const aPos = gl.getAttribLocation(prog, 'aPos');
            gl.enableVertexAttribArray(aPos);
            gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

            // Non-power-of-two textures in WebGL1: CLAMP_TO_EDGE + no mipmaps is required.
            const tex = gl.createTexture();
            gl.bindTexture(gl.TEXTURE_2D, tex);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
            gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);

            const U = {};
            ['uTex', 'uSrcOff', 'uSrcScale', 'uOutSize', 'uIntensity', 'uExposure', 'uContrast', 'uSaturation', 'uWarmth', 'uTint', 'uFade',
                'uGrain', 'uGrainScale', 'uVignette', 'uHalation', 'uLeak', 'uBlur', 'uChroma', 'uMono', 'uTime', 'uSeed', 'uDistort', 'uCircle', 'uDof',
                'uMix', 'uGamma', 'uShadows', 'uHighlights', 'uHalColor', 'uLeakColor'
            ].forEach((n) => { U[n] = gl.getUniformLocation(prog, n); });
            gl.uniform1i(U.uTex, 0);
            const maxTex = gl.getParameter(gl.MAX_TEXTURE_SIZE) || 4096;

            // o: { outW, outH, crop, mirror, settings, time }
            function render(source, o) {
                const outW = o.outW, outH = o.outH;
                if (canvas.width !== outW) canvas.width = outW;
                if (canvas.height !== outH) canvas.height = outH;
                gl.viewport(0, 0, outW, outH);
                gl.activeTexture(gl.TEXTURE0);
                gl.bindTexture(gl.TEXTURE_2D, tex);

                    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source);
                } catch (_) { return canvas; }

                const c = o.crop || FULL_CROP;
                if (o.mirror) {
                    gl.uniform2f(U.uSrcOff, c.x + c.w, c.y);
                    gl.uniform2f(U.uSrcScale, -c.w, c.h);
                } else {
                    gl.uniform2f(U.uSrcOff, c.x, c.y);
                    gl.uniform2f(U.uSrcScale, c.w, c.h);

                gl.uniform1f(U.uWarmth, a.warmth / 100);
                gl.uniform1f(U.uTint, a.tint / 100);
                gl.uniform1f(U.uFade, a.fade / 100 * 0.3);
                gl.uniform1f(U.uGrain, a.grain / 100);

                // same visible grain as the ~900px-tall preview it was framed in.
                gl.uniform1f(U.uGrainScale, L.grainSize * Math.max(1, outH / 1000));
                gl.uniform1f(U.uVignette, a.vignette / 100);
                gl.uniform1f(U.uHalation, a.halation / 100);
                gl.uniform1f(U.uLeak, a.leak / 100);
                gl.uniform1f(U.uBlur, a.blur / 100);
                gl.uniform1f(U.uChroma, a.chroma / 100);
                gl.uniform1f(U.uMono, L.mono ? 1 : 0);
                gl.uniform1f(U.uTime, o.time || 0);
                gl.uniform1f(U.uSeed, s.seed || 0);
                gl.uniform1f(U.uDistort, s.lens ? s.lens.distort : 0);
                gl.uniform1f(U.uCircle, s.lens && s.lens.circle ? 1 : 0);
                gl.uniform1f(U.uDof, s.lens ? s.lens.dof : 0);
                gl.uniform3fv(U.uMix, L.mix);
                gl.uniform3fv(U.uGamma, L.gamma);
                gl.uniform3fv(U.uShadows, L.shadows);
                gl.uniform3fv(U.uHighlights, L.highlights);
                gl.uniform3fv(U.uHalColor, L.halColor);
                gl.uniform3fv(U.uLeakColor, L.leakColor);
                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
                return canvas;
            }
            return { canvas, ok: true, maxTex, render };
        })();

        // Instant-film border and the orange point-and-shoot date stamp. Drawn in 2D on top
        // of a film render — onto the visible part of the preview, onto every recorded video
        // frame, and onto exports — so it's never cropped off by the screen's cover-fit.
        // dateInset (preview only): extra bottom margin so the date stamp isn't hidden
        // under the shutter row — exports pass nothing and get it in the true corner.
        function drawFilmOverlays(ctx, x, y, w, h, s, dateInset) {
            let ix = x, iy = y, iw = w, ih = h;

                const bottom = Math.round(h * (s.frame === 'polaroid' ? 0.17 : 0.13));

        const LIVE_COVER_BASE = 1080;

        // 9:16 = פורטרט מלא (רוחב 1080, גובה 1920).
        var LIVE_EXPORT_DIMENSIONS = {
            '9:16': { w: 1080, h: 1920 },
            '4:5': { w: 1080, h: 1350 },
            '1:1': { w: 1080, h: 1080 },
            '3:4': { w: 1080, h: 1440 },
            '4:3': { w: 1440, h: 1080 },
            '16:9': { w: 1920, h: 1080 }
        };
        // Live: the latest full-frame film render (target ratio, cover-fit onto the screen).
        // It IS film.canvas — the shutter re-renders at full export size, the recorder blits it.
        let liveCoverCanvas = null;
        // Preview render cap (long side, device px) — the shader does ~25 texture reads per
        // pixel, and the shutter re-renders at full 1080×1920 anyway, so the live preview
        // doesn't need full retina resolution to look right.
        const LIVE_PREVIEW_MAX = 1440;
        const uploadPreview = document.createElement('canvas');

        function viewDpr() { return Math.min(2, window.devicePixelRatio || 1); }

        // Where the target-ratio Live frame sits on screen: COVER-fit into #main — fills the
        // screen completely, cropping any excess, so there's never a margin.
        // Where the 9:16 Live frame sits on screen: COVER-fit into #main — fills the screen
        // completely, cropping any excess, so there's never a margin. Same canvas as the
        // grid app (its renderGrid() math). A contain-fit 3:4 version was tried and rejected
        // ("the canvas is wide and not good") — keep it full-screen.
        function getLiveFrameRect(W, H) {
            let frameW = Math.max(1, W), frameH = Math.max(1, H), dx = 0, dy = 0;
            let desiredAR = getLiveTargetRatioValue(); // width/height
            if (desiredAR > 1) desiredAR = 1 / desiredAR;
            if (frameW / frameH > desiredAR) {
                frameH = Math.max(1, Math.round(frameW / desiredAR));
                dy = Math.round((H - frameH) / 2);
            } else {
                frameW = Math.max(1, Math.round(frameH * desiredAR));
                dx = Math.round((W - frameW) / 2);
            }
            return { dx, dy, cw: frameW, ch: frameH };

        const PREVIEW_CONTROLS_H = 160;
        function previewDateInset(H, bottom) {
            return isMobileLayout() ? Math.max(0, PREVIEW_CONTROLS_H - (H - bottom)) : 0;
        }

        // Paints the current state onto the on-screen canvas: Live = the latest film frame
        // (cover-fit) + overlays on its visible part; Upload = the filtered photo, contain-fit.
        function renderView() {
            const m = document.getElementById('main');
            const W = Math.max(1, m.clientWidth), H = Math.max(1, m.clientHeight);
            const dpr = viewDpr();
            const bw = Math.round(W * dpr), bh = Math.round(H * dpr);
            if (gridCanvas.width !== bw) gridCanvas.width = bw;
            if (gridCanvas.height !== bh) gridCanvas.height = bh;
            gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            const s = activeFilmSettings();

            if (state.mode === 'live') {
                gctx.fillStyle = '#2e2329';
                gctx.fillRect(0, 0, W, H);
                const r = getLiveFrameRect(W, H);
                if (liveCoverCanvas && liveCoverCanvas.width > 2) {
                    gctx.drawImage(liveCoverCanvas, r.dx, r.dy, r.cw, r.ch);
                    const vx = Math.max(0, r.dx), vy = Math.max(0, r.dy);
                    const vh = Math.min(H, r.dy + r.ch) - vy;
                    drawFilmOverlays(gctx, vx, vy, Math.min(W, r.dx + r.cw) - vx, vh, s, previewDateInset(H, vy + vh));
                }
                return;
            }

            gctx.fillStyle = state.bg;
            gctx.fillRect(0, 0, W, H);
            const ur = state.uploadRect;
            if (state.srcImage && ur && uploadPreview.width > 2) {
                gctx.drawImage(uploadPreview, ur.x, ur.y, ur.w, ur.h);
                drawFilmOverlays(gctx, ur.x, ur.y, ur.w, ur.h, s, previewDateInset(H, ur.y + ur.h));
            }
        }

        // Upload: re-run the film render for the loaded photo at preview size (contain-fit
        // into #main), then paint it. Called whenever the photo, preset or a setting changes.
        function renderUpload() {
            const src = state.srcImage;
            if (!src) { state.uploadRect = null; renderView(); return; }
            const m = document.getElementById('main');
            const W = Math.max(1, m.clientWidth), H = Math.max(1, m.clientHeight);
            const pad = isMobileLayout() ? 16 : 32;
            const sc = Math.min((W - pad * 2) / src.width, (H - pad * 2) / src.height);
            const w = Math.max(2, Math.round(src.width * sc)), h = Math.max(2, Math.round(src.height * sc));
            state.uploadRect = { x: Math.round((W - w) / 2), y: Math.round((H - h) / 2), w, h };
            const dpr = viewDpr();
            const outW = Math.max(2, Math.min(src.width, Math.round(w * dpr)));
            const outH = Math.max(2, Math.min(src.height, Math.round(h * dpr)));
            film.render(src, { outW, outH, crop: uploadLensCrop(src), mirror: false, settings: activeFilmSettings(), time: state.uploadSeed });
            uploadPreview.width = outW;
            uploadPreview.height = outH;
            uploadPreview.getContext('2d').drawImage(film.canvas, 0, 0);
            renderView();
        }

        // Upload: the whole photo, always (a lens changes perspective feel, never the crop).
        function uploadLensCrop(src) {
            return FULL_CROP;
        }

        // Re-render after any setting change: Upload needs an explicit film pass; Live picks
        // the change up on its next animation frame anyway.
        function refreshView() {
            __filmSettingsCache = null;
            if (state.mode === 'image') renderUpload(); else renderView();
        }

        window.addEventListener('resize', () => {
            // On breakpoint changes, normalize panel state so canvas doesn't "jump"
            try {
                const lm = getLayoutMode();
                if (window.__layoutMode !== lm) {
                    window.__layoutMode = lm;
                    const pan = document.getElementById('panel');
                    const bar = document.getElementById('panel-toggle-bar');
                    if (pan) pan.classList.remove('panel-open');
                    document.body.classList.remove('panel-open');
                    if (bar) bar.classList.remove('active');
                    document.documentElement.style.setProperty('--panel-open-h', '0px');
                }
            } catch (_) { }
            // Keep panel height var in sync (prevents gaps when panel content wraps)
            syncPanelOpenHeightVar();
            // If Live is running and breakpoint changed, restart camera with new constraints
            try {
                if (state.mode === 'live') {
                    const modeNow = getLayoutMode();
                    if (window.__liveLayoutMode !== modeNow) {
                        window.__liveLayoutMode = modeNow;
                        stopCamera();
                        startCamera();
                    }
                }
            } catch (_) { }
            refreshView();
            if (typeof updateMobileButtonsForMode === 'function') updateMobileButtonsForMode();
        });

        function on(id, ev, fn, opts) {
            const el = document.getElementById(id);
            if (el) el.addEventListener(ev, fn, opts);
            return el;
        }

        // ═══════════════════════════════════════════════════
        //  CONTROLS WIRING
        // ═══════════════════════════════════════════════════

        // ── Camera picker (panel 01) & Film picker (panel 02) ──
        // Both are the same fixed 4-column, max-3-row scrolling grid with a custom square
        // scrollbar, built from CAMERA_ORDER / FILM_ORDER.
        const PICKERS = {
            camera: { list: 'camera-presets', track: 'camera-scrollbar', thumb: 'camera-scrollbar-thumb', order: CAMERA_ORDER, items: CAMERAS, active: () => ACTIVE_CAMERA_KEY },
            film: { list: 'film-presets', track: 'film-scrollbar', thumb: 'film-scrollbar-thumb', order: FILM_ORDER, items: FILMS, active: () => ACTIVE_FILM_KEY },
        };

        function renderPicker(kind) {
            const p = PICKERS[kind];
            const el = document.getElementById(p.list);
            if (!el) return;
            el.innerHTML = '';
            p.order.forEach((key) => {
                const it = p.items[key];
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'pal-tgt' + (key === p.active() ? ' active' : '');
                b.dataset.preset = key;
                b.textContent = it.label;
                b.title = it.name; // full name on hover/long-press when the button clips it
                el.appendChild(b);
            });
            syncPickerScrollbar(kind);
        }

        // Positions/sizes a picker's custom square scroll indicator from its list's real
        // scroll metrics — see the CSS comment above .grid-scrollbar for why this isn't native.
        function syncPickerScrollbar(kind) {
            const p = PICKERS[kind];
            const el = document.getElementById(p.list);
            const track = document.getElementById(p.track);
            const thumb = document.getElementById(p.thumb);
            if (!el || !track || !thumb) return;
            const canScroll = el.scrollHeight > el.clientHeight + 1;
            track.style.display = canScroll ? 'block' : 'none';
            if (!canScroll) return;
            const trackH = track.clientHeight;
            const thumbH = Math.max(16, (el.clientHeight / el.scrollHeight) * trackH);
            const maxThumbTop = trackH - thumbH;
            const scrollRange = el.scrollHeight - el.clientHeight;
            const thumbTop = scrollRange > 0 ? (el.scrollTop / scrollRange) * maxThumbTop : 0;
            thumb.style.height = thumbH + 'px';
            thumb.style.top = thumbTop + 'px';
        }
        function syncPickerScrollbars() { syncPickerScrollbar('camera'); syncPickerScrollbar('film'); }

        // Keeps the selected camera/film visible inside its 3-row window (e.g. on panel open).
        function scrollActiveIntoView() {
            Object.keys(PICKERS).forEach((kind) => {
                const el = document.getElementById(PICKERS[kind].list);
                const b = el && el.querySelector('.pal-tgt.active');
                if (!b || !el.clientHeight) return;
                const top = b.offsetTop - el.offsetTop;
                if (top < el.scrollTop || top + b.offsetHeight > el.scrollTop + el.clientHeight) {
                    el.scrollTop = Math.max(0, top - 4);
                }
            });
            syncPickerScrollbars();
        }
        Object.keys(PICKERS).forEach((kind) => {
            const el = document.getElementById(PICKERS[kind].list);
            if (el) el.addEventListener('scroll', () => syncPickerScrollbar(kind), { passive: true });
        });
        window.addEventListener('resize', syncPickerScrollbars);

        function syncPickerActive() {
            Object.keys(PICKERS).forEach((kind) => {
                const p = PICKERS[kind];
                document.querySelectorAll('#' + p.list + ' [data-preset]').forEach((b) => {
                    b.classList.toggle('active', b.dataset.preset === p.active());
                });
            });
            const cam = CAMERAS[ACTIVE_CAMERA_KEY], f = FILMS[ACTIVE_FILM_KEY];
            const setText = (id, t) => { const e = document.getElementById(id); if (e) e.textContent = t; };
            setText('camera-info', cam.name + ' — ' + cam.desc);
            setText('film-info', f.name + ' — ' + f.desc);
            setText('mob-film-badge-label', cam.label + ' · ' + f.label);
        }

        function syncLensSlider() {
            const lens = LENSES[lensIndex(ACTIVE_LENS_KEY)];
            const input = document.getElementById('side-slider');
            const val = document.getElementById('side-val');
            if (input && document.activeElement !== input) input.value = String(lensIndex(ACTIVE_LENS_KEY));
            if (val) { val.textContent = lens.label; val.title = lens.name + ' — ' + lens.feel; }
        }

        // Big centered "85mm · Portrait" label while the lens changes, so the change in
        // spatial feel is explained, then fades.
        let __lensToastTimer = null;
        function showLensToast(lens) {
            const el = document.getElementById('lens-toast');
            if (!el) return;
            el.innerHTML = '<b>' + lens.label + '</b><span>' + lens.name + ' · ' + lens.feel + '</span>';
            el.classList.add('show');
            clearTimeout(__lensToastTimer);
            __lensToastTimer = setTimeout(() => el.classList.remove('show'), 1100);
        }

        function syncFilmUI() {
            syncPickerActive();
            syncLensSlider();
        }

        function setActiveCamera(key) {
            if (!CAMERAS[key]) return;
            ACTIVE_CAMERA_KEY = key;
            // Deliberately does NOT change the lens — picking a camera must never reframe
            // or zoom the picture; only the lens slider does that.
            __filmSettingsCache = null;
            syncFilmUI();
            refreshView();
        }
        function setActiveFilm(key) {
            if (!FILMS[key]) return;
            ACTIVE_FILM_KEY = key;
            __filmSettingsCache = null;
            syncFilmUI();
            refreshView();
        }
        function setActiveLens(key, quiet) {
            const lens = LENSES[lensIndex(key)];
            ACTIVE_LENS_KEY = lens.key;
            __filmSettingsCache = null;
            if (quiet) return;
            syncLensSlider();
            showLensToast(lens);
            refreshView();
        }

        on('camera-presets', 'click', (e) => {
            const b = e.target.closest('[data-preset]');
            if (b) setActiveCamera(b.dataset.preset);
        });
        on('film-presets', 'click', (e) => {
            const b = e.target.closest('[data-preset]');
            if (b) setActiveFilm(b.dataset.preset);
        });
        // The top-left badge is a shortcut into the camera/film picker.
        on('mob-film-badge', 'click', () => toggleMobilePanel());

        // ── Lens: the side slider snaps between LENSES (fisheye at the bottom, tele on top) ──
        on('side-slider', 'input', function () {
            const lens = LENSES[Math.max(0, Math.min(LENSES.length - 1, Math.round(+this.value)))];
            if (lens.key !== ACTIVE_LENS_KEY) setActiveLens(lens.key);
        });
        // Tapping the LENS label steps to the next lens (wraps around).
        on('side-param', 'click', () => {
            setActiveLens(LENSES[(lensIndex(ACTIVE_LENS_KEY) + 1) % LENSES.length].key);
        });
        // Fill mode switch (desktop panel switcher; unreachable on phone-only format,
        // kept for the inert desktop code path) – תמיד עוברים דרך switchToMode
        on('fm-image', 'click', () => switchToMode('image'));
        on('fm-live', 'click', () => switchToMode('live'));

        // Image upload
        const dropZone = document.getElementById('drop-zone');
        on('file-input', 'change', e => loadFile(e.target.files[0]));
        // Upload's persistent "add/replace image" button — opens the same file picker
        // the drop-zone uses, so it works whether or not an image is already loaded.
        on('mob-upload-more', 'click', () => document.getElementById('file-input').click());
        if (dropZone) {
            dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
            dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
            dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('drag-over'); loadFile(e.dataTransfer.files[0]); });
        }
        function updateUploadZoneVisibility() {
            const uz = document.getElementById('upload-zone');
            if (uz) uz.style.display = (state.mode === 'image' && !state.srcImage) ? 'flex' : 'none';
        }
        // Decodes the photo onto a canvas capped to the GPU's texture limit (and 4096 — more
        // than any export needs), so every later render is a plain texture upload.
        const UPLOAD_MAX_SIDE = 4096;
        function loadFile(file) {
            if (!file || !file.type.startsWith('image/')) return;
            const reader = new FileReader();
            reader.onload = ev => {
                const img = new Image();
                img.onload = () => {
                    const cap = Math.min(UPLOAD_MAX_SIDE, film.maxTex || 4096);
                    const sc = Math.min(1, cap / Math.max(img.width, img.height));
                    const c = document.createElement('canvas');
                    c.width = Math.max(2, Math.round(img.width * sc));
                    c.height = Math.max(2, Math.round(img.height * sc));
                    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                    state.srcImage = c;
                    state.uploadSeed = Math.random() * 100;
                    document.getElementById('file-name').textContent = file.name;
                    updateUploadZoneVisibility();
                    renderUpload();
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        }

        // ═══════════════════════════════════════════════════
        //  EXPORT
        // ═══════════════════════════════════════════════════
        const EXPORT_MIN_PX = 2400;

        const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || window.innerWidth <= 700;

        // Shared by every "save this file" path in the app (direct downloads, gallery
        // batch/single-item downloads). On mobile — iOS Safari especially — a plain
        // <a download> click doesn't actually download anything: Safari just navigates to
        // the blob URL and shows the image/video full-screen, leaving the user to find
        // Safari's own share icon and tap "Save Image"/"Save Video" themselves, with an
        // extra page in between. navigator.share({files}) opens the native share sheet
        // directly from the button tap instead — "Save Image"/"Save Video" is one of its
        // first options, no intermediate page. There's no web API for a one-time "always
        // auto-save, no prompt" permission (unlike camera/mic) — the share sheet is the
        // closest thing the platform allows, and still needs one tap in it.
        function shareOrDownloadBlob(blob, name, mimeType) {
            if (!blob) return;
            if (isMobile && navigator.canShare) {
                try {
                    const file = new File([blob], name, { type: mimeType || blob.type });
                    if (navigator.canShare({ files: [file] })) {
                        navigator.share({ files: [file], title: name }).catch(() => {
                            // Share sheet cancelled/failed — open it full-screen so there's
                            // still a way to save it manually, rather than silently falling
                            // into the same <a download> page-navigation this was meant to
                            // avoid right after the user just backed out of the share sheet.
                            openBlobInTab(blob);
                        });
                        return;
                    }
                } catch (_) { /* fall through to direct download */ }
            }
            downloadBlobDirect(blob, name);
        }

        function downloadBlobDirect(blob, name) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.download = name;
            a.href = url;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 2000);
        }

        function dl(cnv, name) {
            // Desktop: prefer synchronous data URL download to avoid losing the user-gesture
            // (some browsers block async-toBlob triggered downloads from a modal button).
            if (!isMobile) {
                try {
                    const url = cnv.toDataURL('image/png');
                    const a = document.createElement('a');
                    a.download = name;
                    a.href = url;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    return;
                } catch (_) { /* fall back to toBlob */ }
            }

            cnv.toBlob(blob => shareOrDownloadBlob(blob, name, 'image/png'), 'image/png');
        }

        // ═══════════════════════════════════════════════════
        //  EXPORT PREVIEW
        // ═══════════════════════════════════════════════════
        let __pendingExport = null; // { type: 'image', canvas, filename } | { type: 'video', blob, filename, mimeType, url }
        let __exportModalWired = false;

        function closeExportModal() {
            const modal = document.getElementById('export-modal');
            const prev = document.getElementById('export-preview-canvas');
            const prevVid = document.getElementById('export-preview-video');
            if (!modal) return;
            modal.classList.remove('open');
            modal.setAttribute('aria-hidden', 'true');

            if (prevVid) {
                try { prevVid.pause(); } catch (_) { }
                prevVid.removeAttribute('src');
                prevVid.style.display = 'none';
            }
            if (prev) prev.style.display = 'block';

            if (__pendingExport && __pendingExport.type === 'video') {
                try { URL.revokeObjectURL(__pendingExport.url); } catch (_) { }
            }
            __pendingExport = null;
        }

        function ensureExportModalWired() {
            if (__exportModalWired) return;
            __exportModalWired = true;
            const modal = document.getElementById('export-modal');
            const closeBtn = document.getElementById('export-close');
            const okBtn = document.getElementById('export-confirm');
            if (!modal || !closeBtn || !okBtn) return;

            closeBtn.addEventListener('click', closeExportModal);
            modal.addEventListener('click', (e) => { if (e.target === modal) closeExportModal(); });
            okBtn.addEventListener('click', () => {
                if (!__pendingExport) return;
                if (__pendingExport.type === 'image') {
                    dl(__pendingExport.canvas, __pendingExport.filename);
                    closeExportModal();
                    return;
                }
                if (__pendingExport.type === 'video') {
                    shareOrDownloadBlob(__pendingExport.blob, __pendingExport.filename, __pendingExport.mimeType || 'video/webm');
                    closeExportModal();
                }
            });
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeExportModal(); });
        }

        function openExportPreview(canvas, filename) {
            const modal = document.getElementById('export-modal');
            const prev = document.getElementById('export-preview-canvas');
            const prevVid = document.getElementById('export-preview-video');
            if (!modal || !prev) { dl(canvas, filename); return; }
            ensureExportModalWired();

            __pendingExport = { type: 'image', canvas, filename };
            if (prevVid) {
                try { prevVid.pause(); } catch (_) { }
                prevVid.removeAttribute('src');
                prevVid.style.display = 'none';
            }
            prev.style.display = 'block';
            prev.width = canvas.width;
            prev.height = canvas.height;
            const pctx = prev.getContext('2d');
            pctx.imageSmoothingEnabled = false;
            pctx.clearRect(0, 0, prev.width, prev.height);
            pctx.drawImage(canvas, 0, 0);

            modal.classList.add('open');
            modal.setAttribute('aria-hidden', 'false');
        }

        function openVideoExportPreview(blob, filename, mimeType) {
            const modal = document.getElementById('export-modal');
            const prev = document.getElementById('export-preview-canvas');
            const prevVid = document.getElementById('export-preview-video');
            if (!modal || !prevVid) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.click();
                setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
                return;
            }
            ensureExportModalWired();

            if (prev) prev.style.display = 'none';
            const url = URL.createObjectURL(blob);
            __pendingExport = { type: 'video', blob, filename, mimeType: mimeType || 'video/webm', url };
            prevVid.style.display = 'block';
            prevVid.src = url;
            try { prevVid.currentTime = 0; } catch (_) { }

            modal.classList.add('open');
            modal.setAttribute('aria-hidden', 'false');
        }

        function openBlobInTab(blob) {
            const url = URL.createObjectURL(blob);
            const w = window.open(url, '_blank');
            if (!w) {
                // Popup blocked — use location fallback
                window.location.href = url;
            }
            setTimeout(() => URL.revokeObjectURL(url), 60000);
        }

        // Long side of an Upload export (capped to the photo's own resolution).
        const UPLOAD_EXPORT_LONG = 2400;

        // The full-resolution result, with frame/date stamp: Live = a copy of the current
        // film frame, Upload = a fresh film render of the photo at export size.
        function buildDownloadCanvas() {
            const s = activeFilmSettings();
            const cnv = document.createElement('canvas');
            if (state.mode === 'live' && liveCoverCanvas && liveCoverCanvas.width > 2) {
                cnv.width = liveCoverCanvas.width;
                cnv.height = liveCoverCanvas.height;
                const ctx = cnv.getContext('2d');
                ctx.drawImage(liveCoverCanvas, 0, 0);
                drawFilmOverlays(ctx, 0, 0, cnv.width, cnv.height, s);
                return cnv;
            }
            const src = state.srcImage;
            if (!src) { cnv.width = 2; cnv.height = 2; return cnv; }
            const sc = Math.min(1, UPLOAD_EXPORT_LONG / Math.max(src.width, src.height));
            cnv.width = Math.max(2, Math.round(src.width * sc));
            cnv.height = Math.max(2, Math.round(src.height * sc));
            film.render(src, { outW: cnv.width, outH: cnv.height, crop: uploadLensCrop(src), mirror: false, settings: s, time: state.uploadSeed });
            const ctx = cnv.getContext('2d');
            ctx.drawImage(film.canvas, 0, 0);
            drawFilmOverlays(ctx, 0, 0, cnv.width, cnv.height, s);
            // film.canvas now holds the export-size render; the preview copy is separate
            // (uploadPreview), so the screen is unaffected.
            return cnv;
        }
        function filmFileName(prefix, ext) {
            return 'film_camera_' + ACTIVE_CAMERA_KEY + '_' + ACTIVE_FILM_KEY + '_' + (prefix ? prefix + '_' : '') + Date.now() + '.' + ext;
        }
        function downloadPixels() {
            if (state.mode === 'image' && !state.srcImage) return;
            openExportPreview(buildDownloadCanvas(), filmFileName('', 'png'));
        }
        // Upload mode's floating Download FAB sends the edited result to the gallery
        // instead — same as Live's shutter — rather than downloading straight away.
        function saveUploadResultToGallery() {
            if (!state.srcImage) return;
            addToGallery({ type: 'image', canvas: buildDownloadCanvas(), fileName: filmFileName('', 'jpg') });
            flashShutter();
        }
        document.getElementById('dl-pixels').addEventListener('click', downloadPixels);

        // Quick white flash over the viewfinder — the "photo taken" feedback.
        function flashShutter() {
            const el = document.getElementById('shutter-flash');
            if (!el) return;
            el.classList.remove('flash');
            void el.offsetWidth; // restart the animation
            el.classList.add('flash');
        }

        // ═══════════════════════════════════════════════════
        //  LIVE CAMERA
        // ═══════════════════════════════════════════════════
        const liveVideo = document.createElement('video');
        liveVideo.autoplay = true; liveVideo.muted = true; liveVideo.playsInline = true;
        liveVideo.style.display = 'none'; document.body.appendChild(liveVideo);

        const liveState = {
            stream: null, rafId: null,
            res: 300, threshold: 132, bgCut: 255, edge: 10,
            fillCol: '#000000', fillCol2: '#888888', strokeCol: '#000000', bgCol: '#ffffff',
            mirror: true,
            bgPixels: null, bgCols: 0, bgRows: 0, bgDiff: 30,
            facingMode: 'user',
            aspectRatio: '9:16',
            userZoom: 1, // user-controlled zoom (hardware if available, else software)
            userSetFacing: false,
            didSetMobileFacingDefault: false,
            didSetMobileZoomDefault: false,
            didApplyMobileHardwareZoomDefault: false,
            // 0.5x isn't a digital zoom value most hardware can reach via the zoom
            // constraint — it's a physically separate ultra-wide lens on the back camera.
            // These track whether we've switched the whole stream to that lens.
            usingUltraWide: false,
            ultraWideDeviceId: null,
            ultraWideChecked: false,
        };

        // Single source of truth: target preview ratio by breakpoint.
        // - mobile: 9:16 (portrait)
        // - tablet: 3:4 (portrait-ish)
        // - desktop: 9:16 (portrait, per request; keeps behavior consistent across devices)
        // Same canvas as the grid app: a 9:16 portrait frame that fills the screen.
        function getLiveTargetRatioKey() {
            return '9:16';
        }

        function getLiveTargetRatioValue() {
            return getAspectRatioValue(getLiveTargetRatioKey());
        }

        function getAspectRatioValue(ratioKey) {
            if (ratioKey === '1:1') return 1;
            if (ratioKey === '3:4') return 3 / 4;
            if (ratioKey === '4:3') return 4 / 3;
            if (ratioKey === '4:5') return 4 / 5;
            if (ratioKey === '16:9') return 16 / 9;
            return 9 / 16; // '9:16' default
        }

        // Same as LIVE_EXPORT_DIMENSIONS – export = exactly what’s on screen
        function getLiveCoverDimensions(ratioKey) {

            updateZoomDialIndicator(liveState.userZoom || min);
        }

        function updateZoomDialIndicator(value) {
            const g = document.getElementById('mob-zoom-ticks-g');
            const dial = document.getElementById('mob-zoom-dial');
            if (!g) return;

        function wireMobileZoomUI() {

        function getLiveVideoConstraints() {

            // many front-camera drivers satisfy a narrow aspectRatio request by digitally
            // zooming into the sensor's center rather than just slicing off the sides,
            // which is what made 1x look unnaturally tight on a face (the sensor itself was
            // being told to pre-crop, before our own "cover" crop below ever saw the frame).
            // Ask for the sensor's natural resolution with no aspect constraint instead, and
            // let getLiveSource()/coverCrop()'s cover-fit do all the cropping down to 9:16 from that
            // fuller capture — same idea as a real camera app keeping 1x at full native FOV.

            }

            // already applies rotation metadata when drawing the <video> element. Rotating

            // actual phone/tablet in the first place — a landscape buffer from a fixed desktop
            // webcam isn't a rotation problem, it's just the camera's native shape.
            // isMobileLayout() can't distinguish that (see startCamera()), so check the UA.
            const needsRotate = isMobileDevice() && !isIOSWebKit() && wantPortraitUI && (vw > vh);
            if (!needsRotate) return { el: liveVideo, sw: vw, sh: vh };

        function getLiveSoftwareZoom() {
